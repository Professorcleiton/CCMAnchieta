<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal dos Pais - SIGA Anchieta</title>
    <style>
        /* (mantenha o mesmo CSS anterior, sem alterações) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .header {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab.active {
            color: #2e7d32;
            border-bottom-color: #2e7d32;
        }
        .form {
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .form.active {
            display: flex;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 3px;
        }
        input, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
            font-family: Arial, sans-serif;
        }
        button {
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .msg {
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }
        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #005088;
            text-decoration: none;
            font-weight: bold;
        }
        .instrucao {
            font-size: 12px;
            color: #666;
            margin-top: -10px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Portal dos Pais / Responsáveis</h1>
        <p>Acompanhe os apontamentos do seu filho</p>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="mostrarAba('login')">🔐 Entrar</div>
            <div class="tab" onclick="mostrarAba('cadastro')">📝 Cadastrar</div>
        </div>

        <!-- Login -->
        <div id="form-login" class="form active">
            <label>E-mail</label>
            <input type="email" id="login-email" placeholder="email@exemplo.com">
            <label>Senha (apenas números)</label>
            <input type="password" id="login-senha" placeholder="Digite sua senha numérica">
            <button onclick="fazerLogin()">Entrar</button>
            <div class="msg" id="msg-login"></div>
        </div>

        <!-- Cadastro -->
        <div id="form-cadastro" class="form">
            <label>Nome completo</label>
            <input type="text" id="cad-nome" placeholder="Seu nome">

            <label>E-mail (será seu login)</label>
            <input type="email" id="cad-email" placeholder="email@exemplo.com">

            <label>Senha (apenas números, ex: RG)</label>
            <input type="password" id="cad-senha" placeholder="Apenas números">

            <label>Telefone com WhatsApp (obrigatório)</label>
            <input type="text" id="cad-telefone" placeholder="(44) 99999-9999" required>

            <label>Nome(s) do(s) filho(s)</label>
            <textarea id="cad-filhos" placeholder="Digite um nome completo por linha, sem abreviar.
O sistema reconhece mesmo sem acentos ou letras maiúsculas."></textarea>
            <div class="instrucao">Escreva o nome completo de cada filho, um por linha. Não abrevie. Acentos e letras maiúsculas/minúsculas não fazem diferença.</div>

            <button id="btn-cadastrar" onclick="cadastrar()">Cadastrar</button>
            <div class="msg" id="msg-cadastro"></div>
        </div>
    </div>

    <a href="index.html" class="voltar">← Voltar ao site</a>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbym9DGWB6hBj7nEmoWFM0vmErbzbq4VVobxY4PYRVEsgPmu7A98OxjLfiFY6D4E_ESUXw/exec';

    function mostrarAba(tipo) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        if (tipo === 'login') {
            document.querySelector('.tab:first-child').classList.add('active');
            document.getElementById('form-login').classList.add('active');
        } else {
            document.querySelector('.tab:last-child').classList.add('active');
            document.getElementById('form-cadastro').classList.add('active');
        }
    }

// =============================================
// FUNÇÃO PARA FAZER REQUISIÇÕES (SEM JSONP)
// =============================================
async function fazerRequisicao(params) {
    try {
        // Constrói a URL com os parâmetros
        let url = APPS_SCRIPT_URL + '?';
        for (let key in params) {
            url += key + '=' + encodeURIComponent(params[key]) + '&';
        }
        // Remove o último '&'
        url = url.slice(0, -1);
        
        console.log('📤 URL:', url);
        
        const response = await fetch(url);
        const data = await response.json();
        console.log('📦 Resposta:', data);
        
        return data;
    } catch (error) {
        console.error('❌ Erro:', error);
        return { status: 'error', message: 'Erro de conexão: ' + error.message };
    }
}

 // =============================================
// LOGIN
// =============================================
async function fazerLogin() {
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const senha = document.getElementById('login-senha').value.trim().replace(/\D/g, '');
    const msg = document.getElementById('msg-login');

    if (!email || !senha) {
        msg.innerText = 'Preencha e-mail e senha.';
        return;
    }

    msg.innerText = 'Verificando...';

    try {
        const data = await fazerRequisicao({
            operacao: 'LOGIN_RESPONSAVEL',
            email: email,
            senha: senha
        });
        
        console.log('📦 Resposta do login:', data);
        
        if (data.status === "success") {
            msg.innerText = '✅ Login bem-sucedido! Redirecionando...';
            sessionStorage.setItem('resp_logado', JSON.stringify(data));

            // Ativa notificações push
            ativarPush(email);

            setTimeout(() => {
                window.location.href = 'painel-responsavel.html';
            }, 1500);
        } else {
            msg.innerText = '❌ ' + (data.message || 'E-mail ou senha incorretos.');
        }
    } catch (e) {
        console.error('Erro no login:', e);
        msg.innerText = 'Erro de conexão.';
    }
}

// =============================================
// CADASTRO
// =============================================
async function cadastrar() {
    const nome = document.getElementById('cad-nome').value.trim();
    const email = document.getElementById('cad-email').value.trim().toLowerCase();
    const senha = document.getElementById('cad-senha').value.trim().replace(/\D/g, '');
    const telefone = document.getElementById('cad-telefone').value.trim();
    const filhosTexto = document.getElementById('cad-filhos').value.trim();
    const msg = document.getElementById('msg-cadastro');
    const btn = document.getElementById('btn-cadastrar');

    if (!nome || !email || !senha || !telefone || !filhosTexto) {
        msg.innerText = 'Preencha todos os campos obrigatórios.';
        return;
    }

    if (telefone.replace(/\D/g, '').length < 10) {
        msg.innerText = 'Informe um número de telefone válido (com DDD).';
        return;
    }

    const filhos = filhosTexto.split('\n').map(f => f.trim()).filter(f => f !== '');
    if (filhos.length === 0) {
        msg.innerText = 'Informe pelo menos um nome de filho.';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Cadastrando...';
    msg.innerText = '';

    try {
        const data = await fazerRequisicao({
            operacao: 'CADASTRAR_RESPONSAVEL',
            nome: nome,
            email: email,
            senha: senha,
            telefone: telefone,
            filhos: JSON.stringify(filhos)
        });
        
        console.log('Resposta do servidor:', data);
        
        if (data.status === 'success') {
            msg.innerText = '✅ Cadastro realizado! Agora você pode entrar.';
            document.getElementById('cad-nome').value = '';
            document.getElementById('cad-email').value = '';
            document.getElementById('cad-senha').value = '';
            document.getElementById('cad-telefone').value = '';
            document.getElementById('cad-filhos').value = '';
            mostrarAba('login');
        } else {
            msg.innerText = '❌ ' + (data.message || 'Erro ao cadastrar.');
        }
    } catch (e) {
        console.error('Erro na requisição:', e);
        msg.innerText = 'Erro de conexão. Verifique sua internet e tente novamente.';
    } finally {
        btn.disabled = false;
        btn.innerText = 'Cadastrar';
    }
}

    // =============================================
    // NOTIFICAÇÕES PUSH
    // =============================================

    const VAPID_PUBLIC_KEY = 'BNJ9Pz0rHohfjvPgrPNqahNelLVvKARagFsoAo8UOU0B2ORFFGHt4kmumrPr698MtL6rOaIht8QjX5XXncehrB0';

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
    }

    async function ativarPush(emailResponsavel) {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
            console.warn('Push não suportado neste navegador.');
            return;
        }

        try {
            const registration = await navigator.serviceWorker.register('/sw.js');
            await navigator.serviceWorker.ready;

            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                console.warn('Permissão de notificação negada.');
                return;
            }

            let subscription = await registration.pushManager.getSubscription();
            if (!subscription) {
                subscription = await registration.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
                });
            }

 // Usa a função fazerRequisicao (já existente) para salvar o token
fazerRequisicao({
    operacao: 'salvar_token_push',
    email: emailResponsavel,
    token: JSON.stringify(subscription)
}).then(function(result) {
    if (result.status === 'success') {
        console.log('✅ Token push salvo com sucesso!');
    } else {
        console.error('❌ Erro ao salvar token push:', result);
    }
});

        } catch (err) {
            console.error('Erro ao ativar push:', err);
        }
    }
</script>
</body>
</html>
