<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="siga-core.js?v=15"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal dos Pais - SIGA Anchieta</title>
    <link rel="manifest" href="/manifest-pais.json">
    <meta name="theme-color" content="#7c3aed">
    <link rel="apple-touch-icon" href="/img/app-pais-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Anchieta Pais">
    <style>
        /* (mantenha o mesmo CSS anterior, sem alterações) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .header {
            width: 100%;
            background-color: #7c3aed;
            color: white;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            box-sizing: border-box;   /* o padding não empurra o cartão para fora da tela */
        }
        @media (max-width: 480px) { .container { width: calc(100% - 24px); padding: 20px; margin: 16px auto; } }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab.active {
            color: #7c3aed;
            border-bottom-color: #7c3aed;
        }
        .form {
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .form.active {
            display: flex;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 3px;
        }
        input, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 100px;
            font-family: Arial, sans-serif;
        }
        button {
            padding: 14px;
            background-color: #7c3aed;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #5b21b6;
        }
        .msg {
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }
        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #005088;
            text-decoration: none;
            font-weight: bold;
        }
        .instrucao {
            font-size: 12px;
            color: #666;
            margin-top: -10px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Portal dos Pais / Responsáveis</h1>
        <p>Acompanhe os apontamentos do seu filho</p>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="mostrarAba('login')">🔐 Entrar</div>
            <div class="tab" onclick="mostrarAba('cadastro')">📝 Cadastrar</div>
        </div>

        <!-- Login -->
        <div id="form-login" class="form active">
            <label>E-mail</label>
            <input type="email" id="login-email" placeholder="email@exemplo.com">
            <label>Senha</label>
            <input type="password" id="login-senha" placeholder="Digite sua senha">
            <label style="display:flex;align-items:center;gap:8px;font-weight:normal;margin:4px 0 10px;cursor:pointer;">
                <input type="checkbox" id="manter-conectado" checked style="width:auto;margin:0;"> Manter conectado neste aparelho
            </label>
            <button onclick="fazerLogin()">Entrar</button>
            <a href="#" onclick="abrirRecuperacaoSenha('responsavel'); return false;" style="display:block;margin-top:10px;font-size:13px;text-align:center;">Esqueci minha senha</a>
            <div class="msg" id="msg-login"></div>
        </div>

        <!-- Cadastro -->
        <div id="form-cadastro" class="form">
            <label>Nome completo</label>
            <input type="text" id="cad-nome" placeholder="Seu nome">

            <label>E-mail (será seu login)</label>
            <input type="email" id="cad-email" placeholder="email@exemplo.com">

            <label>Crie uma senha (mínimo 6 caracteres)</label>
            <input type="password" id="cad-senha" autocomplete="new-password" placeholder="Letras e/ou números">

            <label>Telefone com WhatsApp (obrigatório)</label>
            <input type="text" id="cad-telefone" placeholder="(44) 99999-9999" required>

            <label>Nome(s) do(s) filho(s)</label>
            <textarea id="cad-filhos" placeholder="Digite um nome completo por linha, sem abreviar.
O sistema reconhece mesmo sem acentos ou letras maiúsculas."></textarea>
            <div class="instrucao">Escreva o nome completo de cada filho, um por linha. Não abrevie. Acentos e letras maiúsculas/minúsculas não fazem diferença.</div>

            <button id="btn-cadastrar" onclick="cadastrar()">Cadastrar</button>
            <div class="msg" id="msg-cadastro"></div>
        </div>
    </div>

    <div style="text-align:center;margin:18px 0 0;">
        <button id="btn-instalar-pais" type="button" style="display:none;background:#7c3aed;color:#fff;border:none;padding:12px 22px;border-radius:26px;font-weight:bold;font-size:15px;cursor:pointer;box-shadow:0 3px 10px rgba(124,58,237,.35);">
            📲 Instalar o app Anchieta Pais
        </button>
    </div>

    <a href="index.html" class="voltar">← Voltar ao site</a>

  <script>
    const APPS_SCRIPT_URL = SIGA_CONFIG.APPS_SCRIPT_URL;

    window.addEventListener('DOMContentLoaded', () => {
        // Já entrou antes ("manter conectado")? Vai direto para o painel
        if (obterSessaoResponsavel() && location.hash !== '#cadastro') { location.replace('painel-responsavel.html'); return; }
        // Link "Primeiro acesso" do site (responsaveis.html#cadastro) abre a aba de cadastro
        if (location.hash === '#cadastro') mostrarAba('cadastro');
        configurarInstalacao(document.getElementById('btn-instalar-pais'), 'Anchieta Pais');
    });

    function mostrarAba(tipo) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        if (tipo === 'login') {
            document.querySelector('.tab:first-child').classList.add('active');
            document.getElementById('form-login').classList.add('active');
        } else {
            document.querySelector('.tab:last-child').classList.add('active');
            document.getElementById('form-cadastro').classList.add('active');
        }
    }

// =============================================
// FUNÇÃO PARA FAZER REQUISIÇÕES
// 🔒 POST com corpo JSON: a senha não vai mais na URL (que fica em históricos e logs)
// =============================================
async function fazerRequisicao(params) {
    try {
        const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(params)
        });
        const texto = await response.text();
        try {
            return JSON.parse(texto);
        } catch (e) {
            // O backend antigo responde o cadastro em texto puro
            const t = (texto || '').trim();
            if (t === 'success') return { status: 'success' };
            if (t.indexOf('Cadastro parcial') === 0) return { status: 'success', message: t };
            return { status: 'error', message: t || 'Resposta inválida do servidor.' };
        }
    } catch (error) {
        console.error('❌ Erro:', error);
        return { status: 'error', message: 'Erro de conexão: ' + error.message };
    }
}

 // =============================================
// LOGIN
// =============================================
async function fazerLogin() {
    const email = document.getElementById('login-email').value.trim().toLowerCase();
    const senhas = variacoesSenha(document.getElementById('login-senha').value);
    const msg = document.getElementById('msg-login');

    if (!email || senhas.length === 0) {
        msg.innerText = 'Preencha e-mail e senha.';
        return;
    }

    msg.innerText = 'Verificando...';

    try {
        let data = null;
        for (const senha of senhas) {
            data = await fazerRequisicao({
                operacao: 'LOGIN_RESPONSAVEL',
                email: email,
                senha: senha
            });
            if (data.status === 'success' || data.status === 'pending') break;
        }
        
        console.log('📦 Resposta do login:', data);
        
        if (data.status === 'pending') {
            msg.innerText = '⏳ ' + (data.message || 'Seu cadastro ainda está aguardando a confirmação da secretaria.');
        } else if (data.status === "success") {
            msg.innerText = '✅ Login bem-sucedido! Redirecionando...';
            sessionStorage.setItem('resp_logado', JSON.stringify(data));
            if (document.getElementById('manter-conectado').checked) localStorage.setItem('resp_logado', JSON.stringify(data));
            else localStorage.removeItem('resp_logado');

            // Ativa notificações push
            ativarPush(email);

            setTimeout(() => {
                window.location.href = 'painel-responsavel.html';
            }, 1500);
        } else {
            msg.innerText = '❌ ' + (data.message || 'E-mail ou senha incorretos.');
        }
    } catch (e) {
        console.error('Erro no login:', e);
        msg.innerText = 'Erro de conexão.';
    }
}

// =============================================
// CADASTRO
// =============================================
async function cadastrar() {
    const nome = document.getElementById('cad-nome').value.trim();
    const email = document.getElementById('cad-email').value.trim().toLowerCase();
    const senha = document.getElementById('cad-senha').value.trim();
    const telefone = document.getElementById('cad-telefone').value.trim();
    const filhosTexto = document.getElementById('cad-filhos').value.trim();
    const msg = document.getElementById('msg-cadastro');
    const btn = document.getElementById('btn-cadastrar');

    if (!nome || !email || !senha || !telefone || !filhosTexto) {
        msg.innerText = 'Preencha todos os campos obrigatórios.';
        return;
    }

    const problemaSenha = validarNovaSenha(senha);
    if (problemaSenha) {
        msg.innerText = problemaSenha;
        return;
    }

    if (telefone.replace(/\D/g, '').length < 10) {
        msg.innerText = 'Informe um número de telefone válido (com DDD).';
        return;
    }

    const filhos = filhosTexto.split('\n').map(f => f.trim()).filter(f => f !== '');
    if (filhos.length === 0) {
        msg.innerText = 'Informe pelo menos um nome de filho.';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Cadastrando...';
    msg.innerText = '';

    try {
        const data = await fazerRequisicao({
            operacao: 'CADASTRAR_RESPONSAVEL',
            nome: nome,
            email: email,
            senha: senha,
            telefone: telefone,
            filhos: filhos
        });
        
        console.log('Resposta do servidor:', data);
        
        if (data.status === 'success' || data.status === 'pending') {
            msg.innerText = data.status === 'pending'
                ? '⏳ ' + (data.message || 'Cadastro recebido! A secretaria vai confirmar o vínculo com o(s) aluno(s) e você receberá acesso em breve.')
                : '✅ ' + (data.message ? data.message + ' Agora você pode entrar.' : 'Cadastro realizado! Agora você pode entrar.');
            document.getElementById('cad-nome').value = '';
            document.getElementById('cad-email').value = '';
            document.getElementById('cad-senha').value = '';
            document.getElementById('cad-telefone').value = '';
            document.getElementById('cad-filhos').value = '';
            mostrarAba('login');
        } else {
            msg.innerText = '❌ ' + (data.message || 'Erro ao cadastrar.');
        }
    } catch (e) {
        console.error('Erro na requisição:', e);
        msg.innerText = 'Erro de conexão. Verifique sua internet e tente novamente.';
    } finally {
        btn.disabled = false;
        btn.innerText = 'Cadastrar';
    }
}

    // =============================================
    // NOTIFICAÇÕES PUSH
    // =============================================

    // Se a pessoa já autorizou notificações antes, renova a inscrição em silêncio
    // (corrige inscrições antigas feitas com a chave errada). Se ainda não
    // autorizou, o pedido aparece no Portal, com o botão "Ativar Notificações".
    async function ativarPush(emailResponsavel) {
        try {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            const r = await ativarPushSIGA(emailResponsavel);
            if (!r.ok) console.warn('Push:', r.motivo);
        } catch (err) {
            console.error('Erro ao ativar push:', err);
        }
    }
</script>
</body>
</html>
