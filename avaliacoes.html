<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Avaliação — SIGA CCM Anchieta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --azul: #005088;
      --dourado: #eab308;
      --verde: #0d9488;
      --vermelho: #b91c1c;
      --bg-card: #ffffff;
      --texto: #1f2937;
      --borda: #e5e7eb;
    }
    body.dark {
      --bg-card: #1e293b;
      --texto: #f1f5f9;
      --borda: #334155;
      background: #0f172a;
      color: var(--texto);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-y: auto !important; height: auto !important; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      color: var(--texto);
      padding-bottom: 80px;
    }
    .topbar {
      background: var(--azul); color: #fff; padding: 0.9rem 1rem;
      display: flex; align-items: center; gap: 1rem;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .topbar h1 { font-size: 1.1rem; flex: 1; margin: 0; }
    .topbar #professor-nome { font-size: .85rem; opacity: .9; text-align: right; }
    .topbar .btn-dark {
      background: rgba(255,255,255,.15); border: none; color: #fff;
      padding: .4rem .7rem; border-radius: 8px; cursor: pointer;
    }
    .container { max-width: 1000px; margin: 0 auto; padding: 1.2rem; }

    .aviso {
      background: #fef3c7; border-left: 5px solid var(--dourado);
      padding: .8rem 1rem; border-radius: 8px; font-size: .85rem;
      color: #78350f; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: .6rem;
    }
    body.dark .aviso { background: #422006; color: #fde68a; }

    .card {
      background: var(--bg-card); border-radius: 12px; padding: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,.06); margin-bottom: 1.2rem;
    }
    .card h2 {
      font-size: 1rem; color: var(--azul); margin-top: 0; margin-bottom: 1rem;
      display: flex; align-items: center; gap: .5rem;
    }
    body.dark .card h2 { color: var(--dourado); }

    .header-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    @media (max-width: 700px) { .header-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-weight: 600; font-size: .85rem; margin-bottom: .3rem; color: var(--texto); }
    .form-group input, .form-group select {
      padding: .6rem .8rem; border-radius: 8px; border: 1px solid var(--borda);
      background: var(--bg-card); color: var(--texto); font-size: .9rem;
    }
    .form-group input:read-only { background: #e9ecef; color: #555; font-weight: bold; }
    body.dark .form-group input:read-only { background: #334155; color: #cbd5e1; }

    .editor-toolbar { display: flex; gap: .4rem; margin-bottom: .5rem; flex-wrap: wrap; }
    .editor-toolbar button {
      padding: .4rem .7rem; border: none; border-radius: 6px;
      background: var(--dourado); color: #000; cursor: pointer; font-weight: bold; font-size: .85rem;
    }
    .editor-toolbar button:hover { background: #ca8a04; color: #fff; }

    #editorConteudo {
      width: 100%; min-height: 280px; padding: 1rem;
      border: 1px solid var(--borda); border-radius: 8px; font-size: 15px; 
      font-family: 'Times New Roman', serif;
      background: var(--bg-card); color: var(--texto); overflow-y: auto; line-height: 1.6;
    }
    #editorConteudo:empty:before { content: attr(data-placeholder); color: #94a3b8; }

    .copia-obs-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1rem; margin-top: 1rem; }
    @media (max-width: 600px) { .copia-obs-grid { grid-template-columns: 1fr; } }

    .aviso-limite { color: var(--vermelho); font-weight: bold; margin-top: .8rem; padding: .6rem; background: #fee2e2; border-radius: 6px; display: none; }
    .aviso-limite.ativo { display: block; }
    .info-limite { font-size: .85rem; color: #0369a1; background: #e0f2fe; padding: .5rem .8rem; border-radius: 6px; margin-top: .5rem; display: none; }
    .info-limite.ativo { display: block; }

    .btn-enviar {
      background: var(--azul); color: #fff; border: none; padding: .9rem 1.2rem; border-radius: 8px;
      font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 1rem;
      display: flex; align-items: center; justify-content: center; gap: .5rem; transition: background .2s;
    }
    .btn-enviar:hover:not(:disabled) { background: #003d66; }
    .btn-enviar:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }

    .btn-rascunho {
      background: #64748b; color: #fff; border: none; padding: .9rem 1.2rem; border-radius: 8px;
      font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 1rem;
      display: flex; align-items: center; justify-content: center; gap: .5rem; transition: background .2s;
    }
    .btn-rascunho:hover { background: #475569; }

    .btn-preview {
      background: var(--dourado); color: #000; border: none; padding: .9rem 1.2rem; border-radius: 8px;
      font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: .5rem;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
    }
    .btn-preview:hover { background: #ca8a04; color: #fff; }

    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--azul); color: #fff; padding: .7rem 1.2rem; border-radius: 8px;
      opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 1000;
      font-size: .9rem; font-weight: bold; box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }
    .toast.ativo { opacity: 1; }
    .toast.erro { background: #dc2626; }
    .toast.sucesso { background: #16a34a; }

    .footer-voltar {
      display: inline-flex; align-items: center; gap: .5rem; background: var(--azul); color: #fff;
      padding: .8rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: .9rem; margin-top: 1rem;
    }
    .footer-voltar:hover { background: #003d66; }

    .loading-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; 
      align-items: center; justify-content: center; z-index: 2000; color: #fff; font-size: 1.1rem; font-weight: bold;
    }
    .loading-overlay.ativo { display: flex; }
    .spinner {
      display: inline-block; width: 40px; height: 40px;
      border: 5px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="topbar">
    <h1><i class="fas fa-file-pen"></i> Criar Avaliação</h1>
    <span id="professor-nome">Carregando...</span>
    <button class="btn-dark" id="btn-tema" title="Alternar tema"><i class="fas fa-moon"></i></button>
  </header>

  <main class="container">

    <div class="aviso">
      <i class="fas fa-info-circle" style="margin-top:.15rem;"></i>
      <div>
        <strong>Atenção:</strong> Você pode salvar como <strong>Rascunho</strong> e imprimir depois, ou <strong>Enviar para a Secretaria</strong> direto. O limite de 6 pedidos só é descontado no envio para a secretaria.
      </div>
    </div>

    <!-- BOTÃO MEUS RASCUNHOS -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
      <button onclick="abrirMeusRascunhos()" style="background: #f1f5f9; color: #0f172a; border: 1px solid #cbd5e1; padding: .6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: .5rem;">
        <i class="fas fa-folder-open"></i> Ver Meus Rascunhos
      </button>
    </div>

    <!-- CARD 1: CABEÇALHO -->
    <section class="card">
      <h2><i class="fas fa-id-card"></i> Cabeçalho da Prova</h2>
      <div class="header-grid">
        <div class="form-group">
          <label>Professor(a)</label>
          <input type="text" id="profNome" readonly>
        </div>
        <div class="form-group">
          <label>Ano Letivo</label>
          <input type="text" id="anoLetivo" value="2026" readonly>
        </div>
        <div class="form-group">
          <label>Disciplina</label>
          <select id="selectDisciplina"><option value="">Carregando...</option></select>
        </div>
        <div class="form-group">
          <label>Turma</label>
          <select id="selectTurma"><option value="">Carregando...</option></select>
        </div>
        <div class="form-group">
          <label>Trimestre</label>
          <select id="selectTrimestre">
            <option value="1º">1º Trimestre</option>
            <option value="2º">2º Trimestre</option>
            <option value="3º">3º Trimestre</option>
          </select>
        </div>
        <div class="form-group">
          <label>Data da Prova</label>
          <input type="date" id="dataProva" required>
        </div>
        <div class="form-group">
          <label>Valor da Avaliação</label>
          <input type="text" id="valorProva" placeholder="Ex: 10,0" required>
        </div>
        <div class="form-group">
          <label>Professor(a) — Nome para o Cabeçalho</label>
          <input type="text" id="profNomeCabecalho" placeholder="Como aparecerá na prova">
        </div>
      </div>

      <div id="infoLimite" class="info-limite"></div>
      <div id="avisoLimite" class="aviso-limite"></div>
    </section>

    <!-- CARD 2: EDITOR -->
    <section class="card">
      <h2><i class="fas fa-list-ol"></i> Questões da Avaliação</h2>
      <div class="editor-toolbar">
        <button type="button" onclick="execCmd('bold')"><b>N</b></button>
        <button type="button" onclick="execCmd('italic')"><i>I</i></button>
        <button type="button" onclick="execCmd('underline')"><u>S</u></button>
        <button type="button" onclick="execCmd('insertOrderedList')">1. Lista</button>
        <button type="button" onclick="execCmd('insertUnorderedList')">• Lista</button>
        <button type="button" onclick="execCmd('justifyLeft')">⬅</button>
        <button type="button" onclick="execCmd('justifyCenter')">⬌</button>
        <button type="button" onclick="execCmd('justifyRight')">➡</button>
        <button type="button" onclick="execCmd('formatBlock', 'H3')">Título</button>
      </div>
      <div id="editorConteudo" contenteditable="true" data-placeholder="Digite as questões aqui..."></div>
    </section>

    <!-- CARD 3: CÓPIAS E OBS -->
    <section class="card">
      <h2><i class="fas fa-print"></i> Impressão</h2>
      <div style="background:#e0f2fe;padding:.8rem 1rem;border-radius:8px;margin-bottom:1rem;border-left:4px solid var(--azul);">
        <label style="display:flex;align-items:center;gap:.6rem;cursor:pointer;font-weight:600;">
          <input type="checkbox" id="personalizarProvas" onchange="togglePersonalizacao()" style="width:18px;height:18px;cursor:pointer;">
          <span>📝 Personalizar provas com nome e nº do aluno</span>
        </label>
      </div>
      <div class="copia-obs-grid">
        <div class="form-group">
          <label>Qtd. de Cópias <span style="color: var(--vermelho);">*</span></label>
          <input type="number" id="qtdCopias" min="1" value="30" required>
          <small id="infoPersonalizacao" style="color:#0369a1;font-weight:600;margin-top:.3rem;display:none;"></small>
        </div>
        <div class="form-group">
          <label>Observações (opcional)</label>
          <input type="text" id="observacoes" placeholder="Ex: Imprimir frente e verso, grampear...">
        </div>
      </div>
    </section>

    <!-- BOTÕES DE AÇÃO -->
    <button class="btn-preview" onclick="previewProva()">
      <i class="fas fa-eye"></i> Visualizar Prévia
    </button>
    
    <button class="btn-rascunho" onclick="enviarPedido('Rascunho')">
      <i class="fas fa-save"></i> Salvar como Rascunho
    </button>

    <button class="btn-enviar" id="btnEnviar" onclick="enviarPedido('Pendente')">
      <i class="fas fa-paper-plane"></i> Enviar para a Secretaria (Imprimir)
    </button>

    <div style="text-align: center; margin-top: 1rem; margin-bottom: 2rem;">
      <a href="painel-docente.html" class="footer-voltar">
        <i class="fas fa-arrow-left"></i> Voltar ao Painel
      </a>
    </div>

  </main>

  <!-- MODAL DE RASCUNHOS -->
  <div id="modalRascunhos" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 2000; align-items: center; justify-content: center; padding: 1rem;">
    <div style="background: var(--bg-card); border-radius: 12px; padding: 1.5rem; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.3);">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--borda); padding-bottom: 1rem; margin-bottom: 1rem;">
        <h3 style="margin: 0; color: var(--azul);"><i class="fas fa-folder-open"></i> Meus Rascunhos</h3>
        <button onclick="fecharModalRascunhos()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--texto);">&times;</button>
      </div>
      <div id="listaRascunhos">
        <!-- Preenchido via JS -->
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="loading-overlay" id="loadingOverlay">
    <div style="text-align:center;">
      <span class="spinner"></span>
      <p style="margin-top:1rem;" id="loadingTexto">Enviando...</p>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbym9DGWB6hBj7nEmoWFM0vmErbzbq4VVobxY4PYRVEsgPmu7A98OxjLfiFY6D4E_ESUXw/exec';
    let usuarioLogado = null;
    let alunosDaTurma = [];

    document.addEventListener('DOMContentLoaded', () => {
      const sessaoRaw = sessionStorage.getItem('sgi_ccma_session') || localStorage.getItem('sgi_ccma_session');
      if (!sessaoRaw) { alert('Sessão não encontrada. Faça login novamente.'); window.location.href = 'index.html'; return; }
      try { usuarioLogado = JSON.parse(sessaoRaw); } catch (e) { alert('Sessão inválida.'); window.location.href = 'index.html'; return; }
      if (!usuarioLogado.token) { alert('Sessão sem token.'); window.location.href = 'index.html'; return; }

      document.getElementById('professor-nome').textContent = usuarioLogado.nome || 'Professor(a)';
      document.getElementById('profNome').value = usuarioLogado.nome || '';
      document.getElementById('profNomeCabecalho').value = usuarioLogado.nome || '';

      if (localStorage.getItem('tema') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('btn-tema').innerHTML = '<i class="fas fa-sun"></i>';
      }
      document.getElementById('btn-tema').addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const dark = document.body.classList.contains('dark');
        localStorage.setItem('tema', dark ? 'dark' : 'light');
        document.getElementById('btn-tema').innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      });

      carregarDisciplinas();
      carregarTurmas();

      ['selectDisciplina','selectTurma','selectTrimestre'].forEach(id => {
        document.getElementById(id).addEventListener('change', verificarLimite);
      });

      document.getElementById('selectTurma').addEventListener('change', () => {
        const checkbox = document.getElementById('personalizarProvas');
        if (checkbox && checkbox.checked) togglePersonalizacao();
      });

      document.getElementById('dataProva').value = new Date().toISOString().split('T')[0];
    });

    function toast(msg, tipo) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ativo' + (tipo ? ' ' + tipo : '');
      setTimeout(() => t.classList.remove('ativo'), 3500);
    }

    function mostrarLoading(msg) { document.getElementById('loadingTexto').textContent = msg || 'Carregando...'; document.getElementById('loadingOverlay').classList.add('ativo'); }
    function esconderLoading() { document.getElementById('loadingOverlay').classList.remove('ativo'); }
    function execCmd(cmd, valor) { document.execCommand(cmd, false, valor || null); document.getElementById('editorConteudo').focus(); }

    async function carregarDisciplinas() {
      const select = document.getElementById('selectDisciplina');
      try {
        const url = APPS_SCRIPT_URL + '?aba=avaliacoes_disciplinas_professor&email=' + encodeURIComponent(usuarioLogado.email) + '&nome=' + encodeURIComponent(usuarioLogado.nome);
        const resp = await fetch(url);
        const disciplinas = await resp.json();
        select.innerHTML = '<option value="">Selecione...</option>';
        if (Array.isArray(disciplinas) && disciplinas.length > 0) {
          disciplinas.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
        } else { select.innerHTML = '<option value="">Nenhuma disciplina encontrada</option>'; }
      } catch (e) { select.innerHTML = '<option value="">Erro</option>'; }
    }

    async function carregarTurmas() {
      const select = document.getElementById('selectTurma');
      try {
        const url = APPS_SCRIPT_URL + '?aba=avaliacoes_turmas_professor&email=' + encodeURIComponent(usuarioLogado.email);
        const resp = await fetch(url);
        const turmas = await resp.json();
        select.innerHTML = '<option value="">Selecione...</option>';
        if (Array.isArray(turmas) && turmas.length > 0) {
          turmas.forEach(t => select.innerHTML += `<option value="${t}">${t}</option>`);
        } else { select.innerHTML = '<option value="">Nenhuma turma encontrada</option>'; }
      } catch (e) { select.innerHTML = '<option value="">Erro</option>'; }
    }

    async function togglePersonalizacao() {
      const checkbox = document.getElementById('personalizarProvas');
      const inputQtd = document.getElementById('qtdCopias');
      const info = document.getElementById('infoPersonalizacao');
      const turma = document.getElementById('selectTurma').value;

      if (!checkbox.checked) { inputQtd.disabled = false; inputQtd.value = 30; info.style.display = 'none'; alunosDaTurma = []; return; }
      if (!turma) { toast('Selecione uma turma primeiro.', 'erro'); checkbox.checked = false; return; }

      info.style.display = 'block'; info.textContent = '⏳ Carregando alunos...'; inputQtd.disabled = true;

      try {
        const url = APPS_SCRIPT_URL + '?aba=avaliacoes_alunos_turma&turma=' + encodeURIComponent(turma);
        const resp = await fetch(url);
        const alunos = await resp.json();
        if (!Array.isArray(alunos) || alunos.length === 0) {
          toast('Nenhum aluno encontrado.', 'erro'); checkbox.checked = false; inputQtd.disabled = false; info.style.display = 'none'; alunosDaTurma = []; return;
        }
        alunosDaTurma = alunos;
        inputQtd.value = alunos.length;
        info.textContent = '✅ ' + alunos.length + ' alunos — ' + alunos.length + ' provas.';
      } catch (e) {
        toast('Erro ao carregar alunos.', 'erro'); checkbox.checked = false; inputQtd.disabled = false; info.style.display = 'none'; alunosDaTurma = [];
      }
    }

    let limiteAtual = null;
    async function verificarLimite() {
      const turma = document.getElementById('selectTurma').value;
      const disciplina = document.getElementById('selectDisciplina').value;
      const trimestre = document.getElementById('selectTrimestre').value;
      const info = document.getElementById('infoLimite');
      const aviso = document.getElementById('avisoLimite');
      const btn = document.getElementById('btnEnviar');

      if (!turma || !disciplina || !trimestre) {
        info.classList.remove('ativo'); aviso.classList.remove('ativo'); btn.disabled = false; return;
      }

      try {
        const url = APPS_SCRIPT_URL + '?aba=avaliacoes_limite&turma=' + encodeURIComponent(turma) + '&disciplina=' + encodeURIComponent(disciplina) + '&trimestre=' + encodeURIComponent(trimestre);
        const resp = await fetch(url);
        limiteAtual = await resp.json();

        if (limiteAtual.bloqueado) {
          info.classList.remove('ativo'); aviso.classList.add('ativo');
          aviso.innerHTML = '⚠️ Limite de ' + limiteAtual.limite + ' pedidos foi atingido. Procure a secretaria.';
          btn.disabled = true;
        } else {
          aviso.classList.remove('ativo'); info.classList.add('ativo');
          info.innerHTML = '✅ <strong>' + limiteAtual.contador + ' de ' + limiteAtual.limite + '</strong> pedidos usados. Restam <strong>' + limiteAtual.restantes + '</strong>.';
          btn.disabled = false;
        }
      } catch (e) { console.error(e); }
    }

    // FUNÇÃO DE ENVIO (Aceita Rascunho ou Pendente)
    async function enviarPedido(statusEnvio) {
      const disciplina = document.getElementById('selectDisciplina').value;
      const turma = document.getElementById('selectTurma').value;
      const trimestre = document.getElementById('selectTrimestre').value;
      const dataProva = document.getElementById('dataProva').value;
      const valorProva = document.getElementById('valorProva').value.trim();
      const conteudoHTML = document.getElementById('editorConteudo').innerHTML.trim();
      const qtdCopias = parseInt(document.getElementById('qtdCopias').value);
      const observacoes = document.getElementById('observacoes').value.trim();
      const personalizar = document.getElementById('personalizarProvas').checked;

      if (!disciplina) return toast('Selecione a disciplina.', 'erro');
      if (!turma) return toast('Selecione a turma.', 'erro');
      if (!trimestre) return toast('Selecione o trimestre.', 'erro');
      if (!valorProva) return toast('Informe o valor da avaliação.', 'erro');
      if (!conteudoHTML || conteudoHTML.length < 10) return toast('Digite o conteúdo da avaliação.', 'erro');

      if (statusEnvio === 'Pendente' && (!qtdCopias || qtdCopias < 1)) {
        return toast('Informe a quantidade de cópias para enviar.', 'erro');
      }
      if (personalizar && alunosDaTurma.length === 0) return toast('Aguarde o carregamento dos alunos ou desmarque a opção.', 'erro');
      
      // Só bloqueia se for Pendente e o limite estiver estourado
      if (statusEnvio === 'Pendente' && limiteAtual && limiteAtual.bloqueado) return toast('Limite de pedidos atingido. Salve como rascunho ou procure a secretaria.', 'erro');

      mostrarLoading(statusEnvio === 'Rascunho' ? 'Salvando rascunho...' : 'Enviando pedido...');

      const payload = {
        operacao: 'CRIAR_PEDIDO_AVALIACAO',
        token: usuarioLogado.token,
        disciplina, turma, trimestre, dataProva,
        valor: valorProva, conteudo: conteudoHTML, qtdCopias: qtdCopias || 30, observacoes,
        personalizar: personalizar,
        status: statusEnvio
      };

      try {
        const resp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const result = await resp.json();
        esconderLoading();

        if (result.status === 'success') {
          toast('✅ ' + (statusEnvio === 'Rascunho' ? 'Rascunho salvo!' : 'Pedido enviado! ID: ' + result.idPedido), 'sucesso');
          document.getElementById('editorConteudo').innerHTML = '';
          document.getElementById('valorProva').value = '';
          document.getElementById('observacoes').value = '';
          document.getElementById('personalizarProvas').checked = false;
          document.getElementById('qtdCopias').disabled = false;
          document.getElementById('qtdCopias').value = 30;
          document.getElementById('infoPersonalizacao').style.display = 'none';
          alunosDaTurma = [];
          verificarLimite();
        } else if (result.status === 'unauthorized') {
          toast('Sessão expirada. Faça login novamente.', 'erro');
          setTimeout(() => { window.location.href = 'index.html'; }, 2500);
        } else {
          toast('❌ ' + (result.message || 'Erro ao processar.'), 'erro');
        }
      } catch (e) {
        esconderLoading(); console.error(e); toast('Erro de conexão. Tente novamente.', 'erro');
      }
    }

    function previewProva() {
      const disciplina = document.getElementById('selectDisciplina').value;
      const turma = document.getElementById('selectTurma').value;
      const trimestre = document.getElementById('selectTrimestre').value;
      const dataProva = document.getElementById('dataProva').value;
      const valorProva = document.getElementById('valorProva').value;
      const professorNome = document.getElementById('profNomeCabecalho').value || usuarioLogado.nome;
      const conteudoHTML = document.getElementById('editorConteudo').innerHTML;
      const personalizar = document.getElementById('personalizarProvas').checked;

      if (!disciplina || !turma || !conteudoHTML) return toast('Preencha disciplina, turma e conteúdo antes de visualizar.', 'erro');
      if (personalizar && alunosDaTurma.length === 0) return toast('Aguarde o carregamento dos alunos.', 'erro');

      const dataFormatada = dataProva ? dataProva.split('-').reverse().join('/') : '___/___/2026';
      const brasaoPath = 'img/logoA.png';
      const paginas = personalizar ? alunosDaTurma : [{ numero: '', nome: '' }];

      const paginasHTML = paginas.map((aluno, idx) => {
        const quebraPagina = idx < paginas.length - 1 ? 'page-break-after: always;' : '';
        const nomeAluno = aluno.nome || '';
        const numeroAluno = aluno.numero || '';

        return `
<div class="pagina-prova" style="${quebraPagina}">
  <div class="cabecalho">
    <img src="${brasaoPath}" alt="Brasão Anchieta" class="brasao" onerror="this.src='img/logoA.png'">
    <div class="titulo">
      <h1>Colégio Cívico-Militar Anchieta</h1>
      <p>Secretaria de Estado da Educação — SEED/PR</p>
      <p>Núcleo Regional de Educação de Umuarama</p>
    </div>
    <img src="img/nreumuarama.jpg" alt="NRE Umuarama" class="brasao" onerror="this.style.display='none'">
  </div>

  <div class="info-box">
    <div class="linha">
      <div><strong>Disciplina:</strong> ${disciplina}</div>
      <div><strong>Série/Turma:</strong> ${turma}</div>
      <div><strong>Trimestre:</strong> ${trimestre}</div>
    </div>
    <div class="linha">
      <div><strong>Professor(a):</strong> ${professorNome}</div>
      <div><strong>Data:</strong> ${dataFormatada}</div>
      <div><strong>Valor:</strong> ${valorProva || '___'}</div>
    </div>
  </div>

  <div class="aluno-box">
    <div class="campo">
      <strong>Aluno(a):</strong>
      ${nomeAluno ? `<span style="border-bottom:1px solid #000;min-width:300px;display:inline-block;font-weight:bold;padding:0 5px;">${nomeAluno}</span>` : `<span class="linha-assinatura" style="min-width:300px;"></span>`}
    </div>
    <div class="campo">
      <strong>Nº:</strong>
      ${numeroAluno ? `<span style="border-bottom:1px solid #000;min-width:60px;display:inline-block;font-weight:bold;text-align:center;padding:0 5px;">${numeroAluno}</span>` : `<span class="linha-assinatura" style="min-width:60px;"></span>`}
    </div>
    <div class="campo">
      <strong>Nota:</strong>
      <span class="linha-assinatura" style="min-width:80px;"></span>
    </div>
  </div>

  <div class="conteudo">
    ${conteudoHTML || '<p><em>(Nenhuma questão cadastrada)</em></p>'}
  </div>

  <div class="rodape">
    Avaliação elaborada pelo(a) professor(a) ${professorNome} — ${disciplina} — ${turma} — ${trimestre} de 2026<br>
    Colégio Cívico-Militar Anchieta — Cruzeiro do Oeste/PR
  </div>
</div>`;
      }).join('');

      const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Prévia da Prova — ${disciplina} — ${turma}</title>
<style>
  @page { size: A4 portrait; margin: 12mm 15mm 12mm 15mm; }
  * { box-sizing: border-box; }
  body { font-family: 'Times New Roman', Times, serif; font-size: 11pt; color: #000; line-height: 1.45; margin: 0; padding: 8px; }
  .cabecalho { display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; gap: 15px; border-bottom: 3px double #002B5B; padding-bottom: 10px; margin-bottom: 12px; }
  .cabecalho .brasao { width: 90px; height: 90px; object-fit: contain; }
  .cabecalho .titulo { text-align: center; line-height: 1.2; }
  .cabecalho .titulo h1 { font-size: 15pt; margin: 0 0 3px; color: #002B5B; text-transform: uppercase; letter-spacing: 0.5px; }
  .cabecalho .titulo p { margin: 1px 0; font-size: 9pt; color: #333; }
  .info-box { background: #f4f6f9; border: 1px solid #cbd5e1; border-left: 4px solid #002B5B; padding: 8px 12px; margin-bottom: 12px; font-size: 10pt; border-radius: 4px; }
  .info-box .linha { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 3px 0; }
  .info-box strong { color: #002B5B; }
  .aluno-box { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin: 10px 0; font-size: 10.5pt; }
  .aluno-box .campo { display: flex; align-items: flex-end; gap: 5px; }
  .aluno-box .campo .linha-assinatura { border-bottom: 1px solid #000; display: inline-block; min-width: 180px; height: 16px; }
  .conteudo { margin-top: 15px; text-align: justify; font-size: 11pt; }
  .conteudo h3 { color: #002B5B; font-size: 12pt; margin: 16px 0 8px; padding-bottom: 3px; border-bottom: 1px solid #94a3b8; page-break-after: avoid; }
  .conteudo p { margin: 8px 0; }
  .conteudo ol, .conteudo ul { margin-left: 25px; padding-left: 5px; }
  .conteudo li { margin: 4px 0; }
  .rodape { margin-top: 25px; padding-top: 8px; border-top: 1px solid #94a3b8; font-size: 8.5pt; text-align: center; color: #555; page-break-inside: avoid; }
  .no-print { text-align: center; margin-bottom: 15px; }
  .no-print button { background: #002B5B; color: #FFD700; border: none; padding: 10px 28px; border-radius: 8px; font-size: 13pt; font-weight: bold; cursor: pointer; font-family: 'Segoe UI', sans-serif; margin: 0 5px; }

</style>
</head>
<body>

<div class="no-print">
  <button onclick="window.print()">🖨️ Imprimir ${personalizar ? paginas.length + ' Provas' : 'Prova'}</button>
  <button onclick="window.close()" style="background:#64748b;">✖ Fechar</button>
  ${personalizar ? `<p style="font-size:10pt;color:#666;margin-top:10px;">${paginas.length} páginas — uma por aluno</p>` : ''}
</div>

${paginasHTML}

</body>
</html>`;

      const win = window.open('', '_blank', 'width=900,height=1000');
      if (!win) return toast('Permita pop-ups para visualizar a prévia.', 'erro');
      win.document.write(html);
      win.document.close();
    }

    // =============================================
    // RASCUNHOS
    // =============================================
    async function abrirMeusRascunhos() {
      document.getElementById('modalRascunhos').style.display = 'flex';
      const container = document.getElementById('listaRascunhos');
      container.innerHTML = '<p style="text-align:center; color:#64748b;"><i class="fas fa-spinner fa-spin"></i> Carregando...</p>';

      try {
        const url = APPS_SCRIPT_URL + '?aba=avaliacoes_rascunhos&email=' + encodeURIComponent(usuarioLogado.email);
        const resp = await fetch(url);
        const rascunhos = await resp.json();

        if (!Array.isArray(rascunhos) || rascunhos.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#64748b;">Nenhum rascunho salvo.</p>';
          return;
        }

        container.innerHTML = rascunhos.map(r => `
          <div style="background: #f8fafc; border: 1px solid var(--borda); border-radius: 8px; padding: 1rem; margin-bottom: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem;">
              <strong style="color: var(--azul);">${r.disciplina} - ${r.turma}</strong>
              <span style="font-size: .75rem; background: #e2e8f0; padding: .2rem .5rem; border-radius: 4px;">${r.trimestre}</span>
            </div>
            <div style="font-size: .85rem; color: #64748b; margin-bottom: 1rem;">
              Data da Prova: ${r.dataProva ? r.dataProva.split('-').reverse().join('/') : 'Não informada'} | Valor: ${r.valor || '—'}
            </div>
            <button onclick="carregarRascunho('${r.idPedido}')" style="background: var(--dourado); color: #000; border: none; padding: .5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: .85rem;">
              <i class="fas fa-edit"></i> Abrir e Editar
            </button>
          </div>
        `).join('');
        
        window._rascunhosCache = rascunhos;

      } catch (e) {
        console.error(e);
        container.innerHTML = '<p style="text-align:center; color:red;">Erro ao carregar rascunhos.</p>';
      }
    }

    function fecharModalRascunhos() {
      document.getElementById('modalRascunhos').style.display = 'none';
    }

    function carregarRascunho(idPedido) {
      const r = window._rascunhosCache.find(x => x.idPedido === idPedido);
      if (!r) return;

      document.getElementById('selectDisciplina').value = r.disciplina;
      document.getElementById('selectTurma').value = r.turma;
      document.getElementById('selectTrimestre').value = r.trimestre;
      document.getElementById('dataProva').value = r.dataProva;
      document.getElementById('valorProva').value = r.valor;
      document.getElementById('qtdCopias').value = r.qtdCopias;
      document.getElementById('observacoes').value = (r.observacoes || '').replace('[PERSONALIZADA] ', '');
      document.getElementById('editorConteudo').innerHTML = r.conteudo;

      fecharModalRascunhos();
      toast('Rascunho carregado! Edite se precisar e envie.', 'sucesso');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
