<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicado de Fato Observado – SEED</title>
    <style>
        :root { --verde: #2e7d32; --vermelho: #c62828; --cinza: #f4f6f8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--cinza);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .painel-controle {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
        }
        .painel-controle h3 { margin-bottom: 15px; }
        .painel-controle select, .painel-controle input {
            padding: 10px; width: 100%; font-size: 16px;
            margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;
        }
        .botoes-controle {
            display: flex; gap: 10px; flex-wrap: wrap;
        }
        .btn-emitir {
            background: var(--verde); color: white;
            border: none; padding: 12px 20px; font-size: 16px; font-weight: bold;
            border-radius: 5px; cursor: pointer; margin-right: 10px;
        }
        .btn-emitir:disabled { background: #aaa; cursor: not-allowed; }
        .btn-imprimir {
            background: #1565c0; color: white; border: none;
            padding: 12px 20px; font-size: 16px; font-weight: bold;
            border-radius: 5px; cursor: pointer;
        }
        .btn-laranja {
            background: #f59e0b; color: white; border: none;
            padding: 12px 20px; font-size: 16px; font-weight: bold;
            border-radius: 5px; cursor: pointer;
        }
        .comunicados-container {
            display: flex; flex-wrap: wrap; gap: 30px; justify-content: center;
        }
        .comunicado {
            background: white; padding: 30px 25px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 45%; min-width: 380px; min-height: 400px;
            position: relative; margin-bottom: 20px;
        }
.cabecalho {
    display: flex;
    align-items: center;
    justify-content: space-between; /* distribui espaço entre os itens */
    border-bottom: 3px solid var(--verde);
    padding-bottom: 15px;
    margin-bottom: 25px;
}
.cabecalho .logo-esquerda {
    height: 140px;
}
.cabecalho .logo-direita {
    height: 140px;
}
.cabecalho .info-escola {
    text-align: center;
    flex: 1;
}
        .cabecalho h2 {
            color: var(--verde); font-size: 16px; margin-bottom: 2px;
        }
        .titulo-comunicado {
            text-align: center; font-size: 18px; font-weight: bold;
            margin: 15px 0 10px; color: #222;
        }
        .dados-aluno {
            font-size: 14px; margin-bottom: 15px; display: flex; justify-content: space-between;
        }
        .dados-aluno span { font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: var(--verde); color: white; padding: 8px; text-align: left; font-size: 13px; }
        td { padding: 8px; border-bottom: 1px solid #ddd; vertical-align: top; font-size: 13px; }
        .tipo-positivo { color: var(--verde); font-weight: bold; }
        .tipo-negativo { color: var(--vermelho); font-weight: bold; }
        .assinaturas {
            display: flex; justify-content: center; margin-top: 30px;
        }
        .linha-ass {
            border-top: 1px solid #000; width: 55%; padding-top: 8px;
            text-align: center; font-size: 13px;
        }
        .protocolo {
            margin-top: 20px; font-size: 11px; color: #777;
            display: flex; justify-content: space-between;
            border-top: 1px dashed #ccc; padding-top: 8px;
        }
        .marca-dagua {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 60px; color: rgba(0,0,0,0.03); font-weight: bold;
            pointer-events: none; white-space: nowrap;
        }
        @media print {
            body { background: white; padding: 0; }
            .painel-controle { display: none; }
            .comunicados-container { display: block; }
            .comunicado {
                box-shadow: none; border-radius: 0; width: 48%;
                margin: 0 1% 20px 1%; display: inline-block;
                vertical-align: top; page-break-inside: avoid;
            }
            @page { size: A4; margin: 10mm; }
        }
        .erro { color: red; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="painel-controle" id="painelControle">
    <h3>📄 Emitir Comunicado de Fato Observado (F.O.)</h3>
    <p style="margin-bottom: 15px;">Selecione até <strong>dois alunos</strong>. Se quiser imprimir dois na mesma folha, selecione dois alunos e clique em "Emitir e Imprimir".</p>
    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 250px;">
            <label>Aluno 1:</label>
            <input list="listaAlunos1" id="alunoSelect1" placeholder="Digite o nome...">
            <datalist id="listaAlunos1"></datalist>
            <button class="btn-emitir" onclick="carregarFatos(1)">🔍 Buscar fatos</button>
            <div id="msgErro1" class="erro"></div>
        </div>
        <div style="flex: 1; min-width: 250px;">
            <label>Aluno 2 (opcional):</label>
            <input list="listaAlunos2" id="alunoSelect2" placeholder="Digite o nome...">
            <datalist id="listaAlunos2"></datalist>
            <button class="btn-emitir" onclick="carregarFatos(2)">🔍 Buscar fatos</button>
            <div id="msgErro2" class="erro"></div>
        </div>
    </div>
    <div style="margin-top: 20px;" class="botoes-controle">
        <button class="btn-laranja" id="btnEmitir" onclick="emitirEImprimir()">✅ Emitir e Imprimir</button>
        <button class="btn-imprimir" id="btnImprimir" onclick="window.print()" style="display: none;">🖨️ Imprimir 2ª via</button>
        <button class="btn-emitir" style="background-color: #f59e0b;" onclick="abrirModalNovoFato()">✍️ Registrar Fato</button>
    </div>
</div>

<div class="comunicados-container" id="conteudoComunicado" style="display: none;">
    <!-- Comunicados serão inseridos aqui -->
</div>
<!-- Modal Registrar Fato -->
<div id="modal-novo-fato" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
    <div class="modal-content" style="background:white; padding:25px; border-radius:10px; max-width:500px; width:90%;">
        <h3 style="margin-top:0;">Registrar Novo Fato Observado</h3>
        <div style="margin-bottom:15px;">
            <label>Aluno:</label>
            <input list="listaAlunosFato" id="fato-aluno" placeholder="Digite o nome..." style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
            <datalist id="listaAlunosFato"></datalist>
        </div>
        <div style="margin-bottom:15px;">
            <label>Tipo:</label>
            <select id="fato-tipo" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
                <option value="Positivo">Positivo</option>
                <option value="Negativo">Negativo</option>
            </select>
        </div>
        <div style="margin-bottom:15px;">
            <label>Descrição:</label>
            <textarea id="fato-descricao" rows="3" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;"></textarea>
        </div>
        <div style="margin-bottom:15px;">
            <label>Data do Fato:</label>
            <input type="date" id="fato-data" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button onclick="fecharModalNovoFato()" style="padding:10px 20px; border:none; border-radius:5px; background:#ccc; cursor:pointer;">Cancelar</button>
            <button onclick="salvarNovoFato()" style="padding:10px 20px; border:none; border-radius:5px; background:#2e7d32; color:white; cursor:pointer;">Salvar</button>
        </div>
    </div>
</div>
<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbym9DGWB6hBj7nEmoWFM0vmErbzbq4VVobxY4PYRVEsgPmu7A98OxjLfiFY6D4E_ESUXw/exec';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    let user = null;

    if (token) {
        try {
            const decoded = atob(token).split(':');
            user = { email: decoded[0], nivel: parseInt(decoded[1]) || 0, setor: decoded[2] };
        } catch (e) {
            user = null;
        }
    }

    if (!user || (user.setor !== 'meivs' && user.nivel < 4)) {
        document.getElementById('painelControle').innerHTML = '<div class="erro">Acesso restrito. Apenas MEIVS ou administradores nível 4 podem emitir comunicados.</div>';
    } else {
        carregarListaAlunos();
        const alunoUrl = params.get('aluno');
        if (alunoUrl) {
            document.getElementById('alunoSelect1').value = alunoUrl;
            carregarFatos(1);
        }
    }

    async function carregarListaAlunos() {
        try {
            const res = await fetch(APPS_SCRIPT_URL + '?aba=alunos');
            const alunos = await res.json();
            const datalist1 = document.getElementById('listaAlunos1');
            const datalist2 = document.getElementById('listaAlunos2');
            alunos.forEach(nome => {
                const option1 = document.createElement('option');
                option1.value = nome;
                datalist1.appendChild(option1);
                const option2 = document.createElement('option');
                option2.value = nome;
                datalist2.appendChild(option2);
            });
        } catch (e) {
            console.error('Erro ao carregar alunos:', e);
        }
    }

    let fatosAluno1 = [];
    let fatosAluno2 = [];
    let dadosAluno1 = null;
    let dadosAluno2 = null;

    async function carregarFatos(numero) {
        const campoAluno = document.getElementById(`alunoSelect${numero}`);
        const msgErro = document.getElementById(`msgErro${numero}`);
        const aluno = campoAluno.value.trim();
        if (!aluno) {
            msgErro.innerText = 'Selecione um aluno.';
            return;
        }
        msgErro.innerText = '';

        try {
            const res = await fetch(APPS_SCRIPT_URL + '?aba=fatos_aluno&aluno=' + encodeURIComponent(aluno));
            const data = await res.json();
            if (data.error) {
                msgErro.innerText = data.error;
                return;
            }
            if (numero === 1) {
                fatosAluno1 = data.fatos;
                dadosAluno1 = data;
            } else {
                fatosAluno2 = data.fatos;
                dadosAluno2 = data;
            }
            if (data.fatos.length === 0) {
                msgErro.innerText = 'Nenhum fato pendente para este aluno.';
            } else {
                msgErro.innerText = `✅ ${data.fatos.length} fato(s) encontrado(s).`;
            }
            atualizarVisualizacao();
        } catch (e) {
            msgErro.innerText = 'Erro ao buscar dados.';
        }
    }

    function atualizarVisualizacao() {
        const temAluno1 = fatosAluno1.length > 0;
        const temAluno2 = fatosAluno2.length > 0;
        const container = document.getElementById('conteudoComunicado');
        const btnEmitir = document.getElementById('btnEmitir');
        
        if (!temAluno1 && !temAluno2) {
            container.style.display = 'none';
            btnEmitir.style.display = 'none';
            return;
        }
        
        container.style.display = 'flex';
        container.innerHTML = '';
        
        if (temAluno1) {
            container.appendChild(criarComunicadoHTML(dadosAluno1, fatosAluno1));
        }
        if (temAluno2) {
            container.appendChild(criarComunicadoHTML(dadosAluno2, fatosAluno2));
        }
        
        btnEmitir.style.display = 'inline-block';
    }

    function criarComunicadoHTML(data, fatos) {
        const div = document.createElement('div');
        div.className = 'comunicado';
        const hoje = new Date().toLocaleDateString('pt-BR');

        let html = `
<div class="cabecalho">
    <img src="img/logoA.png" alt="Logo Escola" class="logo-esquerda">
    <div class="info-escola">
        <h2>Anchieta, C E C-M-Ef M N</h2>
        <strong>Colégio Cívico Militar Anchieta</strong><br>
        Av. Wenceslau Bras, 356 – Sul Brasileira<br>
        87.400-000 – Cruzeiro do Oeste – PR<br>
        Telefone: (44) 3676-1247 | E-mail: cztanchieta@seed.pr.gov.br
    </div>
    <img src="img/nreumuarama.jpg" alt="Logo NRE" class="logo-direita">
</div>
        <div class="titulo-comunicado">Comunicado de Fato Observado – F.O.</div>
        <div class="dados-aluno">
            <div>Aluno(a): <span>${data.aluno}</span></div>
            <div>Turma: <span>${data.turma || 'Não informada'}</span></div>
        </div>
        <table>
            <thead>
                <tr><th>Data</th><th>Tipo</th><th>Descrição</th></tr>
            </thead>
            <tbody>`;

        fatos.forEach(f => {
            const classeTipo = f.tipo.toLowerCase() === 'positivo' ? 'tipo-positivo' : 'tipo-negativo';
            html += `
            <tr>
                <td>${f.data}</td>
                <td class="${classeTipo}">${f.tipo}</td>
                <td>${f.descricao}</td>
            </tr>`;
        });

        html += `
            </tbody>
        </table>
        <div class="assinaturas">
            <div class="linha-ass">Coordenação / Direção</div>
        </div>
        <div class="protocolo">
            <span>Data de emissão: ${hoje}</span>
            <span>Protocolo: <span class="numProtocolo">---</span></span>
        </div>`;

        div.innerHTML = html;
        return div;
    }

    async function emitirEImprimir() {
        const ids1 = fatosAluno1.map(f => f.idLinha);
        const ids2 = fatosAluno2.map(f => f.idLinha);
        const todosIds = ids1.concat(ids2);
        if (todosIds.length === 0) return;

        document.getElementById('btnEmitir').disabled = true;
        document.getElementById('btnEmitir').innerText = 'Emitindo...';

        // Emite todos os fatos de uma vez
        const aluno = dadosAluno1 ? dadosAluno1.aluno : (dadosAluno2 ? dadosAluno2.aluno : '');
        try {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    operacao: "marcar_fatos_emitidos",
                    aluno: aluno,
                    emailOperador: user.email || 'sistema',
                    ids: todosIds
                })
            });
            const result = await res.json();
            if (result.status === 'success') {
                // Atualiza todos os protocolos no HTML
                document.querySelectorAll('.numProtocolo').forEach(el => {
                    el.innerText = result.protocolo;
                });
                document.getElementById('btnEmitir').style.display = 'none';
                document.getElementById('btnImprimir').style.display = 'inline-block';
                // Não chama window.print automaticamente – o usuário clica em "Imprimir 2ª via"
                // window.print(); 
            } else {
                alert('Erro ao emitir comunicado: ' + (result.message || 'Tente novamente.'));
                document.getElementById('btnEmitir').disabled = false;
                document.getElementById('btnEmitir').innerText = '✅ Emitir e Imprimir';
            }
        } catch (e) {
            alert('Erro de conexão.');
            document.getElementById('btnEmitir').disabled = false;
            document.getElementById('btnEmitir').innerText = '✅ Emitir e Imprimir';
        }
    }
    // Abrir modal de novo fato (preenche lista de alunos se necessário)
async function abrirModalNovoFato() {
    // Garantir que a lista de alunos esteja carregada
    if (document.getElementById('listaAlunosFato').options.length === 0) {
        await carregarListaAlunos(); // já existente
        // Copiar opções para o datalist do modal
        const datalistOrig = document.getElementById('listaAlunos');
        const datalistFato = document.getElementById('listaAlunosFato');
        datalistFato.innerHTML = datalistOrig.innerHTML;
    }
    // Preencher data atual
    const hoje = new Date().toISOString().split('T')[0];
    document.getElementById('fato-data').value = hoje;
    document.getElementById('modal-novo-fato').style.display = 'flex';
}

function fecharModalNovoFato() {
    document.getElementById('modal-novo-fato').style.display = 'none';
}

async function salvarNovoFato() {
    const aluno = document.getElementById('fato-aluno').value.trim();
    const tipo = document.getElementById('fato-tipo').value;
    const descricao = document.getElementById('fato-descricao').value.trim();
    const data = document.getElementById('fato-data').value;

    if (!aluno || !descricao || !data) {
        alert('Preencha todos os campos.');
        return;
    }

    try {
        const res = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                operacao: "SALVAR_FATO_SEED",
                aluno: aluno,
                tipo: tipo,
                descricao: descricao,
                data: data,
                emailOperador: user.email || 'sistema'
            })
        });
        const result = await res.json();
        if (result.status === 'success') {
            alert('Fato registrado com sucesso!');
            fecharModalNovoFato();
            // Limpar campos
            document.getElementById('fato-aluno').value = '';
            document.getElementById('fato-descricao').value = '';
        } else {
            alert('Erro: ' + result.message);
        }
    } catch (e) {
        alert('Erro de conexão.');
    }
}
</script>
</body>
</html>
