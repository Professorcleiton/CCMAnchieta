<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Responsável - SIGA Anchieta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .header {
            background-color: #2e7d32;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .header h2 { margin: 0; }
        .logout {
            display: inline-block;
            margin-top: 10px;
            color: #fff;
            text-decoration: underline;
            cursor: pointer;
        }
        .filtro {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .filtro select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 100%;
            max-width: 300px;
        }
        .registros { display: flex; flex-direction: column; gap: 10px; }
        .registro {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #005088;
        }
        .registro .setor { font-weight: bold; }
        .registro .data { font-size: 12px; color: #666; margin-top: 5px; }
        .registro .texto { margin-top: 8px; font-size: 15px; }
        .sem-registros { text-align: center; padding: 30px; color: #999; }
        .erro { color: red; text-align: center; padding: 30px; }

                .tabela-documentos {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .tabela-documentos th {
            background: #f1f5f9;
            padding: 10px;
            text-align: left;
            font-weight: bold;
            color: #475569;
        }
        .tabela-documentos td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        .status-pendente { color: #d97706; font-weight: bold; }
        .status-enviado { color: #2563eb; font-weight: bold; }
        .status-verificado { color: #059669; font-weight: bold; }
        .status-rejeitado { color: #dc2626; font-weight: bold; }
        .btn-upload {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-upload:hover { background: #1d4ed8; }
        .btn-visualizar {
            background: #059669;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Painel do Responsável</h2>
        <p id="nome-responsavel">Carregando...</p>
        <a class="logout" onclick="logout()">Sair</a>
    </div>

    <div class="filtro">
        <label>Selecione o filho:</label>
        <select id="filho-select" onchange="filtrarRegistros()">
            <option value="">Todos os filhos</option>
        </select>
    </div>
        <!-- Seção de Documentos -->
    <div class="filtro" style="margin-top: 20px;">
        <h3 style="margin-top: 0; color: #2e7d32;">📁 Documentos Solicitados</h3>
        <div id="lista-documentos" style="margin-top: 15px;">
            <div class="sem-registros">Carregando documentos...</div>
        </div>
    </div>
    <div class="registros" id="lista-registros">
        <div class="sem-registros">Carregando registros...</div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbym9DGWB6hBj7nEmoWFM0vmErbzbq4VVobxY4PYRVEsgPmu7A98OxjLfiFY6D4E_ESUXw/exec';

        let dadosResponsavel = null;
        let todosRegistros = [];

        window.addEventListener('DOMContentLoaded', () => {
            const sessao = sessionStorage.getItem('resp_logado');
            if (!sessao) {
                window.location.href = 'responsaveis.html';
                return;
            }
            dadosResponsavel = JSON.parse(sessao);
            document.getElementById('nome-responsavel').innerText = `Bem-vindo(a), ${dadosResponsavel.nome}`;

            const select = document.getElementById('filho-select');
            dadosResponsavel.alunos.forEach(aluno => {
                const opt = document.createElement('option');
                opt.value = aluno;
                opt.textContent = aluno;
                select.appendChild(opt);
            });

            carregarRegistros();
        });

        function logout() {
            sessionStorage.removeItem('resp_logado');
            window.location.href = 'responsaveis.html';
        }

        async function carregarRegistros() {
            const container = document.getElementById('lista-registros');
            container.innerHTML = '<div class="sem-registros">Carregando dados do servidor...</div>';

            try {
                const res = await fetch(APPS_SCRIPT_URL + '?aba=todos_os_dados');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                console.log('Dados recebidos:', data);

                if (!data.apontamentos && !data.documentos && !data.ocorrencias) {
                    throw new Error('Resposta do servidor não contém os dados esperados.');
                }

                const alunosVinculados = dadosResponsavel.alunos;
                todosRegistros = [];

                // Apontamentos
                (data.apontamentos || []).forEach(r => {
                    if (alunosVinculados.includes(r.aluno)) {
                        todosRegistros.push({...r, tipo: 'apontamento'});
                    }
                });

                // Documentos
                (data.documentos || []).forEach(d => {
                    if (alunosVinculados.includes(d.aluno)) {
                        todosRegistros.push({
                            aluno: d.aluno,
                            setor: 'adm',
                            texto: `📄 Documento: ${d.documento} - Status: ${d.status}`,
                            funcionario: 'Secretaria',
                            dataAtual: d.data,
                            tipo: 'documento'
                        });
                    }
                });

                // Ocorrências
                (data.ocorrencias || []).forEach(oc => {
                    if (alunosVinculados.includes(oc.aluno)) {
                        const icone = oc.tipo === "Saída Antecipada" ? "🚪" : "⏰";
                        const horario = oc.data ? oc.data.split(' ')[1] : '';
                        todosRegistros.push({
                            aluno: oc.aluno,
                            setor: 'adm',
                            texto: `${icone} ${oc.tipo}: ${oc.motivo} | Autorizado por: ${oc.autorizador} | Horário: ${horario}`,
                            funcionario: oc.autorizador || 'Secretaria',
                            dataAtual: oc.data,
                            tipo: 'ocorrencia'
                        });
                    }
                });

                filtrarRegistros();
            } catch (e) {
                console.error('Erro ao carregar:', e);
                container.innerHTML = `<div class="erro">Erro ao carregar dados: ${e.message}.<br>Verifique sua conexão e tente novamente.</div>`;
            }
        }

        function filtrarRegistros() {
            const filhoSelecionado = document.getElementById('filho-select').value;
            const container = document.getElementById('lista-registros');

            let registros = todosRegistros;
            if (filhoSelecionado) {
                registros = registros.filter(r => r.aluno === filhoSelecionado);
            }

            registros.sort((a, b) => (b.dataAtual || '').localeCompare(a.dataAtual || ''));

            if (registros.length === 0) {
                container.innerHTML = '<div class="sem-registros">Nenhum registro encontrado para o(s) aluno(s) selecionado(s).</div>';
                return;
            }

            container.innerHTML = registros.map(r => {
                const setor = r.setor === 'meivs' ? 'MEIV\'S' :
                               r.setor === 'pedagogico' ? 'Pedagógico' :
                               r.setor === 'adm' ? 'ADM' : 'Professores';
                const corSetor = r.setor === 'meivs' ? '#0284c7' :
                                 r.setor === 'pedagogico' ? '#0d9488' :
                                 r.setor === 'adm' ? '#4f46e5' : '#b91c1c';
                return `
                <div class="registro" style="border-left-color: ${corSetor}">
                    <div class="setor" style="color: ${corSetor}">${setor}</div>
                    <div class="texto">${r.texto}</div>
                    <div class="data">${r.dataAtual} • ${r.funcionario || 'SIGA'}</div>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
