<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Responsável - SIGA Anchieta</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        .header { background-color: #2e7d32; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .header h2 { margin: 0; }
        .logout { display: inline-block; margin-top: 10px; color: #fff; text-decoration: underline; cursor: pointer; }
        .filtro { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .filtro select { padding: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 100%; max-width: 300px; }
        .registros { display: flex; flex-direction: column; gap: 10px; }
        .registro { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid #005088; }
        .registro .setor { font-weight: bold; }
        .registro .data { font-size: 12px; color: #666; margin-top: 5px; }
        .registro .texto { margin-top: 8px; font-size: 15px; }
        .sem-registros { text-align: center; padding: 30px; color: #999; }
        .erro { color: red; text-align: center; padding: 30px; }
        .tabela-documentos { width: 100%; border-collapse: collapse; font-size: 14px; }
        .tabela-documentos th { background: #f1f5f9; padding: 10px; text-align: left; font-weight: bold; color: #475569; }
        .tabela-documentos td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        .status-pendente { color: #d97706; font-weight: bold; }
        .status-enviado { color: #2563eb; font-weight: bold; }
        .status-verificado { color: #059669; font-weight: bold; }
        .status-rejeitado { color: #dc2626; font-weight: bold; }
        .btn-upload { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-upload:hover { background: #1d4ed8; }
        .btn-visualizar { background: #059669; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Painel do Responsável</h2>
        <p id="nome-responsavel">Carregando...</p>
        <a class="logout" onclick="logout()">Sair</a>
    </div>

    <div class="filtro">
        <label>Selecione o filho:</label>
        <select id="filho-select" onchange="filtrarRegistros()">
            <option value="">Todos os filhos</option>
        </select>
    </div>

    <div class="filtro" style="margin-top: 20px;">
        <h3 style="margin-top: 0; color: #2e7d32;">📁 Documentos Solicitados</h3>
        <p style="font-size: 14px; color: #666; margin-bottom: 15px;">
            Para enviar um documento solicitado pela secretaria, utilize o formulário abaixo.
            Após o envio, o status será atualizado automaticamente.
        </p>
        <a href="https://forms.gle/yKgcvaT81Pxnc9Ra9" target="_blank" style="display: inline-block; padding: 12px 20px; background: #2e7d32; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-bottom: 15px;">
            📤 Enviar Documento
        </a>
        <div id="lista-documentos" style="margin-top: 15px;">
            <div class="sem-registros">Carregando documentos...</div>
        </div>
    </div>

    <div class="registros" id="lista-registros">
        <div class="sem-registros">Carregando registros...</div>
    </div>

    <script>
        var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbym9DGWB6hBj7nEmoWFM0vmErbzbq4VVobxY4PYRVEsgPmu7A98OxjLfiFY6D4E_ESUXw/exec';
        var dadosResponsavel = null;
        var todosRegistros = [];

        window.addEventListener('DOMContentLoaded', function() {
            var sessao = sessionStorage.getItem('resp_logado');
            if (!sessao) { window.location.href = 'responsaveis.html'; return; }
            dadosResponsavel = JSON.parse(sessao);
            document.getElementById('nome-responsavel').innerText = 'Bem-vindo(a), ' + dadosResponsavel.nome;
            var select = document.getElementById('filho-select');
            dadosResponsavel.alunos.forEach(function(aluno) {
                var opt = document.createElement('option'); opt.value = aluno; opt.textContent = aluno; select.appendChild(opt);
            });
            carregarRegistros();
            carregarDocumentosAluno();
        });

        function logout() { sessionStorage.removeItem('resp_logado'); window.location.href = 'responsaveis.html'; }

        async function carregarRegistros() {
            var container = document.getElementById('lista-registros');
            container.innerHTML = '<div class="sem-registros">Carregando dados do servidor...</div>';
            try {
                var res = await fetch(APPS_SCRIPT_URL + '?aba=todos_os_dados');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                var data = await res.json();
                if (!data.apontamentos && !data.documentos && !data.ocorrencias) throw new Error('Dados não encontrados.');
                var alunosVinculados = dadosResponsavel.alunos;
                todosRegistros = [];
                (data.apontamentos || []).forEach(function(r) { if (alunosVinculados.includes(r.aluno)) todosRegistros.push(Object.assign({}, r, {tipo: 'apontamento'})); });
                (data.documentos || []).forEach(function(d) { if (alunosVinculados.includes(d.aluno)) todosRegistros.push({aluno: d.aluno, setor: 'adm', texto: '📄 Documento: ' + d.documento + ' - Status: ' + d.status, funcionario: 'Secretaria', dataAtual: d.data, tipo: 'documento'}); });
                (data.ocorrencias || []).forEach(function(oc) { if (alunosVinculados.includes(oc.aluno)) { var icone = oc.tipo === 'Saída Antecipada' ? '🚪' : '⏰'; var horario = oc.data ? oc.data.split(' ')[1] : ''; todosRegistros.push({aluno: oc.aluno, setor: 'adm', texto: icone + ' ' + oc.tipo + ': ' + oc.motivo + ' | Autorizado por: ' + oc.autorizador + ' | Horário: ' + horario, funcionario: oc.autorizador || 'Secretaria', dataAtual: oc.data, tipo: 'ocorrencia'}); } });
                filtrarRegistros();
            } catch (e) { container.innerHTML = '<div class="erro">Erro ao carregar: ' + e.message + '</div>'; }
        }

        function filtrarRegistros() {
            var filhoSelecionado = document.getElementById('filho-select').value;
            var container = document.getElementById('lista-registros');
            var registros = filhoSelecionado ? todosRegistros.filter(function(r) { return r.aluno === filhoSelecionado; }) : todosRegistros;
            registros.sort(function(a, b) { return (b.dataAtual || '').localeCompare(a.dataAtual || ''); });
            if (registros.length === 0) { container.innerHTML = '<div class="sem-registros">Nenhum registro encontrado.</div>'; return; }
            container.innerHTML = registros.map(function(r) {
                var setor = r.setor === 'meivs' ? "MEIV'S" : r.setor === 'pedagogico' ? 'Pedagógico' : r.setor === 'adm' ? 'ADM' : 'Professores';
                var cor = r.setor === 'meivs' ? '#0284c7' : r.setor === 'pedagogico' ? '#0d9488' : r.setor === 'adm' ? '#4f46e5' : '#b91c1c';
                return '<div class="registro" style="border-left-color:' + cor + '"><div class="setor" style="color:' + cor + '">' + setor + '</div><div class="texto">' + r.texto + '</div><div class="data">' + r.dataAtual + ' • ' + (r.funcionario || 'SIGA') + '</div></div>';
            }).join('');
        }

        async function carregarDocumentosAluno() {
            var container = document.getElementById('lista-documentos');
            container.innerHTML = '<div class="sem-registros">Carregando documentos...</div>';
            var todosDocumentos = [];
            for (var i = 0; i < dadosResponsavel.alunos.length; i++) {
                var aluno = dadosResponsavel.alunos[i];
                try {
                    var res = await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({operacao: 'listar_documentos_aluno', aluno: aluno}) });
                    var docs = await res.json();
                    docs.forEach(function(d) { d.aluno = aluno; });
                    todosDocumentos = todosDocumentos.concat(docs);
                } catch (e) { console.error('Erro ao carregar docs de', aluno, e); }
            }
            if (todosDocumentos.length === 0) { container.innerHTML = '<div class="sem-registros">Nenhum documento solicitado.</div>'; return; }
            var html = '<table class="tabela-documentos"><thead><tr><th>Aluno</th><th>Documento</th><th>Status</th><th>Data</th><th>Ação</th></tr></thead><tbody>';
            todosDocumentos.forEach(function(doc) {
                var statusClass = doc.status === 'Pendente' ? 'status-pendente' : doc.status === 'Enviado' ? 'status-enviado' : doc.status === 'Verificado' ? 'status-verificado' : 'status-rejeitado';
                var botao = '';
                if (doc.status === 'Pendente') botao = '<button class="btn-upload" onclick="abrirUpload(\'' + doc.aluno + '\',\'' + doc.documento + '\')">📤 Enviar</button>';
                else if (doc.status === 'Enviado' || doc.status === 'Verificado') botao = '<a href="' + doc.link + '" target="_blank" class="btn-visualizar">👁️ Ver</a>';
                var dataExibicao = doc.dataSolicitacao || '-';
                if (dataExibicao.length > 10) dataExibicao = dataExibicao.substring(0, 10);
                html += '<tr><td>' + doc.aluno + '</td><td>' + doc.documento + '</td><td class="' + statusClass + '">' + doc.status + '</td><td>' + dataExibicao + '</td><td>' + botao + '</td></tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function abrirUpload(aluno, documento) {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = '.pdf,.jpg,.jpeg,.png';
            input.onchange = async function() {
                var file = input.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) { alert('Arquivo máximo 5MB.'); return; }
                var reader = new FileReader();
                reader.onload = async function(e) {
                    var base64 = e.target.result.split(',')[1];
                    try {
                        var res = await fetch(APPS_SCRIPT_URL, { method: 'POST', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({operacao: 'upload_documento', aluno: aluno, documento: documento, nomeArquivo: file.name, arquivo: base64}) });
                        var result = await res.json();
                        if (result.status === 'success') { alert('✅ Documento enviado!'); carregarDocumentosAluno(); }
                        else { alert('❌ ' + (result.message || 'Erro ao enviar.')); }
                    } catch (e) { alert('Erro de conexão.'); }
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }
    </script>
</body>
</html>
