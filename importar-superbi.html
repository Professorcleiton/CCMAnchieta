<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lançar Índices (Admin) — Super BI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --azul: #005088; --verde: #16a34a; --amarelo: #eab308; --vermelho: #dc2626;
      --bg-card: #ffffff; --texto: #1f2937; --borda: #e5e7eb;
    }
    body.dark {
      --bg-card: #1e293b; --texto: #f1f5f9; --borda: #334155; background: #0f172a; color: var(--texto);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-y: auto !important; height: auto !important; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; color: var(--texto); padding-bottom: 80px; }

    .topbar { background: var(--azul); color: #fff; padding: 0.9rem 1rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 100; }
    .topbar h1 { font-size: 1.1rem; flex: 1; margin: 0; }
    .topbar a { color: #fff; text-decoration: none; background: rgba(255,255,255,.15); padding: .4rem .8rem; border-radius: 8px; font-size: .85rem; }

    .container { max-width: 1000px; margin: 0 auto; padding: 1.2rem; }

    .aviso { background: #e0f2fe; border-left: 5px solid var(--azul); padding: .9rem 1rem; border-radius: 8px; font-size: .85rem; color: #0369a1; margin-bottom: 1.5rem; }
    body.dark .aviso { background: #0c4a6e; color: #bae6fd; }

    .card { background: var(--bg-card); border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 6px rgba(0,0,0,.06); margin-bottom: 1.5rem; }
    
    .form-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr auto; gap: 1rem; align-items: end; }
    @media (max-width: 900px) { .form-row { grid-template-columns: 1fr; } }
    
    .form-group { display: flex; flex-direction: column; }
    label { font-weight: 600; font-size: .85rem; margin-bottom: .3rem; }
    select, input { padding: .6rem; border: 1px solid var(--borda); border-radius: 6px; background: var(--bg-card); color: var(--texto); font-size: .9rem; }
    
    .btn-add { background: var(--azul); color: #fff; border: none; padding: .6rem 1.2rem; border-radius: 6px; font-weight: bold; cursor: pointer; height: 40px; }
    
    .tabela-wrap { overflow-x: auto; margin-bottom: 1.5rem; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; font-size: .9rem; }
    th, td { padding: .7rem; border-bottom: 1px solid var(--borda); text-align: left; }
    th { background: #f8fafc; color: var(--azul); font-weight: 600; }
    body.dark th { background: #1e293b; }
    
    .linha-remover { background: transparent; border: none; color: var(--vermelho); cursor: pointer; font-size: 1.1rem; }
    .acoes { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem; }
    .btn { padding: .8rem 1.5rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    .btn-salvar { background: var(--verde); color: #fff; }
    
    .superbi-btn { background: #dc2626; color: white; text-decoration: none; padding: .8rem 1.2rem; border-radius: 8px; font-weight: bold; display: inline-block; margin-bottom: 1rem; }
  </style>
</head>
<body>

  <header class="topbar">
    <h1><i class="fas fa-chart-line"></i> Lançamento Centralizado (Admin)</h1>
    <a href="restrito.html"><i class="fas fa-arrow-left"></i> Voltar</a>
  </header>

  <main class="container">

    <a href="https://app.powerbi.com/" target="_blank" class="superbi-btn">
      <i class="fas fa-external-link-alt"></i> Abrir Relatório do Power BI
    </a>

    <div class="aviso">
      <i class="fas fa-info-circle"></i>
      <strong>MODO ADMIN:</strong> Como coordenação/direção, você pode lançar os índices para qualquer professor da escola.
    </div>

    <div class="card">
      <h2 style="font-size: 1.1rem; margin-bottom: 1rem; color: var(--azul);">Adicionar Lançamento</h2>
      
      <div class="form-row">
        <div class="form-group">
          <label>Professor(a):</label>
          <select id="add-professor" onchange="filtrarTurmas()">
            <option value="">Carregando professores...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Turma:</label>
          <select id="add-turma" onchange="filtrarPlataformas()">
            <option value="">Selecione o Prof. primeiro...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Plataforma:</label>
          <select id="add-plataforma" onchange="filtrarDisciplina()">
            <option value="">Selecione...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Disciplina:</label>
          <select id="add-disciplina">
            <option value="">Carregando...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Índice:</label>
          <input type="text" id="add-indice" placeholder="Ex: 2,937">
        </div>

        <button class="btn-add" onclick="adicionarLinha()">+ Add</button>
      </div>
    </div>

    <div class="card">
      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Professor</th>
              <th>Turma</th>
              <th>Plataforma</th>
              <th>Disciplina</th>
              <th>Índice</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:2rem;">Nenhum lançamento adicionado.</td></tr>
          </tbody>
        </table>
      </div>

      <div class="acoes">
        <button class="btn btn-salvar" onclick="salvarNaPlanilha()">Salvar na Planilha</button>
      </div>
    </div>

  </main>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbym9DGWB6hBj7nEmoWFM0vmErbzbq4VVobxY4PYRVEsgPmu7A98OxjLfiFY6D4E_ESUXw/exec';
    let usuarioLogado = null;
    let professoresList = [];
    let listaDeLancamentos = [];

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Verifica a sessão
      const sessaoRaw = localStorage.getItem('sgi_ccma_session') || sessionStorage.getItem('sgi_ccma_session');
      if (!sessaoRaw) { alert('Sessão não encontrada. Faça login novamente.'); window.location.href = 'index.html'; return; }
      
      usuarioLogado = JSON.parse(sessaoRaw);
      
      if (!usuarioLogado || usuarioLogado.nivel < 4) {
        alert('Acesso restrito à Direção/Admin (Nível 4).');
        window.location.href = 'restrito.html';
        return;
      }

      // 2. Busca a lista de professores
      try {
        const resp = await fetch(APPS_SCRIPT_URL + '?aba=usuarios');
        const users = await resp.json();
        
        professoresList = users.filter(u => u.setor === 'professores' || u.setor === 'direcao');
        
        const selectProf = document.getElementById('add-professor');
        selectProf.innerHTML = '<option value="">Selecione o Professor...</option>';
        professoresList.forEach(p => {
          selectProf.innerHTML += `<option value="${p.email}">${p.nome}</option>`;
        });
      } catch (e) {
        console.error('Erro ao carregar professores:', e);
      }

      // 3. Busca as disciplinas únicas da aba Horarios e preenche o select
      await carregarDisciplinasDaPlanilha();
    });

    // 🆕 Função que puxa as disciplinas da planilha sem repetir
    async function carregarDisciplinasDaPlanilha() {
      try {
        const resp = await fetch(APPS_SCRIPT_URL + '?aba=disciplinas_todas');
        const disciplinas = await resp.json();
        
        const select = document.getElementById('add-disciplina');
        select.innerHTML = '<option value="">Selecione...</option>';
        
        if (Array.isArray(disciplinas) && disciplinas.length > 0) {
          disciplinas.forEach(d => {
            select.innerHTML += `<option value="${d}">${d}</option>`;
          });
        } else {
          select.innerHTML = '<option value="">Nenhuma disciplina na grade</option>';
        }
      } catch (e) {
        console.error('Erro ao buscar disciplinas:', e);
        const select = document.getElementById('add-disciplina');
        select.innerHTML = '<option value="">Erro ao carregar</option>';
      }
    }

    async function filtrarTurmas() {
      const emailProf = document.getElementById('add-professor').value;
      const selectTurma = document.getElementById('add-turma');
      selectTurma.innerHTML = '<option value="">Carregando turmas...</option>';

      if (!emailProf) return;

      try {
        const resp = await fetch(APPS_SCRIPT_URL + '?aba=avaliacoes_turmas_professor&email=' + encodeURIComponent(emailProf));
        const turmas = await resp.json();
        
        selectTurma.innerHTML = '<option value="">Selecione a Turma...</option>';
        if (turmas.length === 0) {
           selectTurma.innerHTML = '<option value="">Nenhuma turma p/ este prof.</option>';
        } else {
           turmas.forEach(t => {
             selectTurma.innerHTML += `<option value="${t}">${t}</option>`;
           });
        }
      } catch (e) {
        console.error(e);
      }
    }

    function filtrarPlataformas() {
      const turma = document.getElementById('add-turma').value;
      const selectPlataforma = document.getElementById('add-plataforma');
      
      selectPlataforma.innerHTML = '<option value="">Selecione a Plataforma...</option>';
      
      if (!turma) {
         selectPlataforma.innerHTML = '<option value="">Selecione a Turma primeiro...</option>';
         return;
      }

      let plataformasDisponiveis = [];
      
      // Regra de Matemática (Matific para 6/7, Khan para 8/9)
      if (turma.startsWith('6') || turma.startsWith('7')) {
        plataformasDisponiveis.push({ nome: 'Matific', disciplina: 'Matemática' });
      } else {
        plataformasDisponiveis.push({ nome: 'Khan Academy', disciplina: 'Matemática' });
      }

      // Outras plataformas
      plataformasDisponiveis.push({ nome: 'Redação Paraná', disciplina: 'Português' });
      plataformasDisponiveis.push({ nome: 'Leia Paraná', disciplina: 'Todas' });
      plataformasDisponiveis.push({ nome: 'Inglês Paraná', disciplina: 'Inglês' });
      plataformasDisponiveis.push({ nome: 'Quizizz', disciplina: 'Todas' });

      plataformasDisponiveis.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.nome;
        opt.textContent = p.nome;
        opt.setAttribute('data-disciplina', p.disciplina);
        selectPlataforma.appendChild(opt);
      });
    }

    function filtrarDisciplina() {
      const selectPlataforma = document.getElementById('add-plataforma');
      const selectDisciplina = document.getElementById('add-disciplina');
      
      const optionSelecionada = selectPlataforma.options[selectPlataforma.selectedIndex];
      const disciplinaSugerida = optionSelecionada.getAttribute('data-disciplina');

      // Se a disciplina for 'Todas' (como Quizizz, Leia), destrava para o professor escolher
      if (disciplinaSugerida && disciplinaSugerida !== 'Todas') {
        selectDisciplina.value = disciplinaSugerida;
        selectDisciplina.disabled = true; // Trava o campo
      } else {
        selectDisciplina.value = ''; 
        selectDisciplina.disabled = false; // Destrava o campo
      }
    }

    function adicionarLinha() {
      const profEmail = document.getElementById('add-professor') ? document.getElementById('add-professor').value : '';
      const profNome = document.getElementById('add-professor').options[document.getElementById('add-professor').selectedIndex].text;
      let turmaDigitada = document.getElementById('add-turma').value.trim().toUpperCase();
      const plataforma = document.getElementById('add-plataforma').value;
      const disciplina = document.getElementById('add-disciplina').value;
      let indiceStr = document.getElementById('add-indice').value.replace(',', '.');
      const indice = parseFloat(indiceStr);

      if (!profEmail || !turmaDigitada || !plataforma || !disciplina || isNaN(indice)) {
        alert('Preencha todos os campos corretamente.');
        return;
      }

      // TRADUTOR DE TURMA (Padroniza para 6A, 7B, etc.)
      let turmaFormatada = turmaDigitada;
      const matchAno = turmaDigitada.match(/(\d+)[º°]?\s*(?:ANO|SÉRIE)?\s*([A-D])/i);
      if (matchAno) {
        turmaFormatada = matchAno[1] + matchAno[2].toUpperCase(); 
      } else if (turmaDigitada.includes('NEM')) {
        turmaFormatada = turmaDigitada.replace(/[^0-9]/g, '') + 'NEM';
      } else if (turmaDigitada.includes('FD')) {
        turmaFormatada = turmaDigitada.replace(/[^0-9]/g, '') + 'FD';
      } else if (turmaDigitada.includes('AGRO')) {
        turmaFormatada = '1AGRO';
      }

      listaDeLancamentos.push({ 
        profEmail, profNome, turma: turmaFormatada, plataforma, disciplina, indice 
      });
      
      renderizarTabela();
      
      // 🆕 Limpa os campos e DESTRAVA a disciplina para o próximo lançamento
      document.getElementById('add-indice').value = '';
      document.getElementById('add-disciplina').disabled = false; 
      document.getElementById('add-indice').focus();
    }

    // 🆕 Função para renderizar a tabela (sem recarregar a página)
    function renderizarTabela() {
      const tbody = document.getElementById('corpo-tabela');
      tbody.innerHTML = '';

      if (listaDeLancamentos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:2rem;">Nenhum lançamento adicionado.</td></tr>';
        return;
      }

      listaDeLancamentos.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.profNome}</strong></td>
          <td>${item.turma}</td>
          <td>${item.plataforma}</td>
          <td>${item.disciplina}</td>
          <td style="color: var(--azul); font-weight: bold;">${item.indice.toFixed(3)}</td>
          <td><button class="linha-remover" onclick="removerLinha(${index})"><i class="fas fa-trash"></i></button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 🆕 Correção do botão de remover (não recarrega a página)
    function removerLinha(index) {
      listaDeLancamentos.splice(index, 1);
      renderizarTabela();
    }

    async function salvarNaPlanilha() {
      if (listaDeLancamentos.length === 0) return alert('Adicione pelo menos um lançamento.');
      
      const btn = event.target;
      btn.disabled = true;
      btn.innerHTML = 'Salvando...';

      const payload = {
        operacao: 'IMPORTAR_LANCAMENTOS',
        token: usuarioLogado.token,
        lancamentos: listaDeLancamentos.map(l => ({
          professor: l.profEmail,
          turma: l.turma,
          plataforma: l.plataforma,
          disciplina: l.disciplina,
          valor: l.indice
        }))
      };

      try {
        const resp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload)
        });
        const result = await resp.json();

        if (result.status === 'success') {
          alert(`✅ ${result.inseridos} lançamento(s) salvo(s)!`);
          listaDeLancamentos = [];
          renderizarTabela();
        } else {
          alert('❌ Erro: ' + result.message);
        }
      } catch (e) {
        alert('❌ Erro de conexão.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Salvar na Planilha';
      }
    }
  </script>
</body>
</html>
