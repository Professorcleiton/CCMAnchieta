<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA - Acesso ao Sistema</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#005088">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 28px;
            color: #005088;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            display: block;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            background-color: #005088;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #003d66;
        }
        .btn-restrito {
            background-color: #d9534f;
        }
        .btn-restrito:hover {
            background-color: #c9302c;
        }
        .aviso {
            font-size: 12px;
            color: #999;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SIGA</h1>
        <span class="subtitle">Sistema Integrado de Gestão</span>

        <!-- Links para as funcionalidades do seu sistema -->
        <a href="frequencia.html" class="btn">Frequenciômetro</a>
        <a href="patrimonio.html" class="btn">Patrimônio</a>
        <a href="equipe.html" class="btn">Equipe Escolar</a>
        <a href="restrito.html" class="btn btn-restrito">Área Restrita</a>

        <div class="aviso">
            Interface de acesso simplificada
        </div>
    </div>

    <!-- Mantém o PWA funcionando -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
    </script>
</body>
</html>
