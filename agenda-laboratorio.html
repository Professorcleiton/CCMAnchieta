<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda do Laboratório - SIGA Anchieta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            color: #1e293b;
        }
        
        /* Barra superior */
        .top-bar {
            background: #0f172a;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .top-bar h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar h1 i { color: #eab308; }
        .top-bar .acoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-voltar {
            background: rgba(255,255,255,0.15);
            color: white;
        }
        .btn-voltar:hover { background: rgba(255,255,255,0.25); }
        .btn-imprimir {
            background: #eab308;
            color: #0f172a;
        }
        .btn-imprimir:hover { background: #ca8a04; }
        .btn-turno {
            background: white;
            color: #0f172a;
        }
        .btn-turno.ativo {
            background: #eab308;
            color: #0f172a;
        }
        
        /* Container */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            overflow-x: auto;
        }
        
        /* Legenda */
        .legenda {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .legenda-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        .legenda-cor {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .legenda-cor.livre { background: #dcfce7; border: 1px solid #86efac; }
        .legenda-cor.ocupado { background: #fef3c7; border: 1px solid #fde68a; }
        .legenda-cor.lab { background: #dbeafe; border: 1px solid #93c5fd; }
        
        /* Tabela da grade */
        .grade-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 13px;
        }
        .grade-table th {
            background: #0f172a;
            color: #eab308;
            padding: 14px 10px;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            border: 1px solid #1e293b;
        }
        .grade-table td {
            padding: 10px;
            border: 1px solid #e2e8f0;
            vertical-align: top;
            min-width: 150px;
            height: 70px;
        }
        .grade-table td.livre {
            background: #dcfce7;
            text-align: center;
            color: #166534;
            font-weight: 500;
            font-size: 12px;
        }
        .grade-table td.ocupado {
            background: #fef3c7;
        }
        .grade-table td.lab-info {
            background: #dbeafe;
        }
        .grade-table td.lab-info .icone-lab {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .grade-table .horario-col {
            background: #f8fafc;
            font-weight: 700;
            text-align: center;
            color: #475569;
            width: 100px;
            font-size: 13px;
        }
        
        .celula-turma {
            font-weight: 700;
            color: #1e293b;
            display: block;
        }
        .celula-disciplina {
            color: #475569;
            font-size: 12px;
            display: block;
        }
        .celula-professor {
            color: #64748b;
            font-size: 11px;
            display: block;
            margin-top: 2px;
        }
        
        /* Responsivo */
        @media (max-width: 768px) {
            .grade-table th, .grade-table td {
                padding: 6px;
                font-size: 11px;
                min-width: 100px;
            }
            .top-bar h1 { font-size: 16px; }
        }
        
        @media print {
            body { background: white; }
            .top-bar { background: #0f172a !important; -webkit-print-color-adjust: exact; }
            .btn, .acoes { display: none; }
            .container { margin: 0; padding: 0; }
            .grade-table { box-shadow: none; }
        }
    </style>
</head>
<body>

    <!-- Barra superior -->
    <div class="top-bar">
        <h1><i class="fa-solid fa-desktop"></i> Agenda do Laboratório</h1>
        <div class="acoes">
            <button class="btn btn-turno ativo" id="btn-manha" onclick="filtrarTurno('Manhã')">
                <i class="fa-solid fa-sun"></i> Manhã
            </button>
            <button class="btn btn-turno" id="btn-tarde" onclick="filtrarTurno('Tarde')">
                <i class="fa-solid fa-moon"></i> Tarde
            </button>
            <button class="btn btn-imprimir" onclick="window.print()">
                <i class="fa-solid fa-print"></i> Imprimir
            </button>
            <a href="restrito.html" class="btn btn-voltar">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </a>
        </div>
    </div>

    <div class="container">
        <!-- Legenda -->
        <div class="legenda">
            <div class="legenda-item">
                <div class="legenda-cor livre"></div>
                <span>Livre</span>
            </div>
            <div class="legenda-item">
                <div class="legenda-cor ocupado"></div>
                <span>Ocupado (outra sala)</span>
            </div>
            <div class="legenda-item">
                <div class="legenda-cor lab"></div>
                <span>Laboratório de Informática</span>
            </div>
        </div>

        <!-- Grade de horários -->
        <div id="area-grade">
            <div style="text-align:center;padding:50px;color:#64748b;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size:40px;display:block;margin-bottom:15px;"></i>
                Carregando agenda do laboratório...
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbym9DGWB6hBj7nEmoWFM0vmErbzbq4VVobxY4PYRVEsgPmu7A98OxjLfiFY6D4E_ESUXw/exec';
        let turnoAtual = 'Manhã';
        let todosHorarios = [];

        // Inicialização
        window.addEventListener('DOMContentLoaded', function() {
            // Verifica sessão (opcional)
            carregarAgenda();
        });

        function filtrarTurno(turno) {
            turnoAtual = turno;
            document.getElementById('btn-manha').classList.toggle('ativo', turno === 'Manhã');
            document.getElementById('btn-tarde').classList.toggle('ativo', turno === 'Tarde');
            renderizarGrade();
        }

        async function carregarAgenda() {
            try {
                // Busca TODOS os horários (sem filtro)
                const url = APPS_SCRIPT_URL + '?aba=horarios';
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'success' && data.horarios) {
                    todosHorarios = data.horarios;
                    renderizarGrade();
                } else {
                    document.getElementById('area-grade').innerHTML = 
                        '<div style="text-align:center;padding:50px;color:#94a3b8;">Nenhum horário encontrado.</div>';
                }
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('area-grade').innerHTML = 
                    '<div style="text-align:center;padding:50px;color:#ef4444;">Erro ao carregar dados.</div>';
            }
        }

        function renderizarGrade() {
            const area = document.getElementById('area-grade');
            const dias = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
            const aulas = ['1ª', '2ª', '3ª', '4ª', '5ª', '6ª'];
            
            // Horários da manhã e tarde
            const horarios = turnoAtual === 'Manhã' 
                ? ['06:55-07:45', '07:45-08:35', '08:35-09:30', '09:40-10:30', '10:30-11:20', '11:20-12:10']
                : ['12:55-13:45', '13:45-14:35', '14:35-15:30', '15:40-16:30', '16:30-17:20', '17:20-18:10'];

            // Filtra horários do turno atual
            const horariosTurno = todosHorarios.filter(h => h.turno === turnoAtual);

            let html = '<table class="grade-table">';
            html += '<thead><tr><th>Horário</th>';
            dias.forEach(dia => {
                html += '<th>' + dia + '</th>';
            });
            html += '</tr></thead><tbody>';

            aulas.forEach((aula, index) => {
                html += '<tr>';
                html += '<td class="horario-col">' + aula + '<br><small>' + horarios[index] + '</small></td>';

                dias.forEach(dia => {
                    // Busca aulas neste dia/horário
                    const aulasNesteHorario = horariosTurno.filter(h => h.dia === dia && h.aula === aula);
                    
                    if (aulasNesteHorario.length === 0) {
                        // Livre
                        html += '<td class="livre">🟢 Livre</td>';
                    } else {
                        // Verifica se alguma é no laboratório
                        const aulaLab = aulasNesteHorario.find(h => 
                            h.local && h.local.toLowerCase().includes('lab')
                        );
                        const aulaTablet = aulasNesteHorario.find(h => 
                            h.local && h.local.toLowerCase().includes('tablet')
                        );
                        
                        if (aulaLab) {
                            // Aula no laboratório
                            html += '<td class="lab-info">';
                            html += '<span class="icone-lab">🖥️ LAB</span>';
                            html += '<span class="celula-turma">' + aulaLab.turma + '</span>';
                            html += '<span class="celula-disciplina">' + (aulaLab.disciplina || '—') + '</span>';
                            html += '<span class="celula-professor">👨‍🏫 ' + (aulaLab.professor || '—') + '</span>';
                            html += '</td>';
                        } else if (aulaTablet) {
                            // Aula com tablet
                            html += '<td class="lab-info">';
                            html += '<span class="icone-lab">📱 TABLET</span>';
                            html += '<span class="celula-turma">' + aulaTablet.turma + '</span>';
                            html += '<span class="celula-disciplina">' + (aulaTablet.disciplina || '—') + '</span>';
                            html += '<span class="celula-professor">👨‍🏫 ' + (aulaTablet.professor || '—') + '</span>';
                            html += '</td>';
                        } else {
                            // Ocupado, mas não no laboratório
                            html += '<td class="ocupado">';
                            aulasNesteHorario.forEach(h => {
                                html += '<span class="celula-turma">' + h.turma + '</span>';
                                html += '<span class="celula-disciplina">' + (h.disciplina || '—') + '</span>';
                                html += '<span class="celula-professor">👨‍🏫 ' + (h.professor || '—') + '</span>';
                                if (h.professor_apoio) {
                                    html += '<span class="celula-professor">🤝 ' + h.professor_apoio + '</span>';
                                }
                            });
                            html += '</td>';
                        }
                    }
                });

                // Insere intervalo após a 3ª aula
                if (aula === '3ª') {
                    html += '</tr><tr class="intervalo" style="background:#fef3c7;">';
                    html += '<td class="horario-col" style="background:#fde68a;font-weight:700;">☕ INTERVALO</td>';
                    const horarioIntervalo = turnoAtual === 'Manhã' ? '09:30-09:40' : '15:30-15:40';
                    html += '<td colspan="5" style="text-align:center;font-weight:600;color:#92400e;background:#fef3c7;">' + horarioIntervalo + '</td>';
                }

                html += '</tr>';
            });

            html += '</tbody></table>';
            area.innerHTML = html;
        }
    </script>
</body>
</html>
