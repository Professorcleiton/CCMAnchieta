<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="siga-core.js?v=15"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda do Laboratório - SIGA Anchieta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            color: #1e293b;
        }
        
        /* Barra superior */
        .top-bar {
            background: #0f172a;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .top-bar h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .top-bar h1 i { color: #eab308; }
        .top-bar .acoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .btn-voltar {
            background: rgba(255,255,255,0.15);
            color: white;
        }
        .btn-voltar:hover { background: rgba(255,255,255,0.25); }
        .btn-imprimir {
            background: #eab308;
            color: #0f172a;
        }
        .btn-imprimir:hover { background: #ca8a04; }
        .btn-turno {
            background: white;
            color: #0f172a;
        }
        .btn-turno.ativo {
            background: #eab308;
            color: #0f172a;
        }
        
        /* Container */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            overflow-x: auto;
        }
        
        /* Legenda */
        .legenda {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .legenda-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
        }
        .legenda-cor {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
        .legenda-cor.livre { background: #dcfce7; border: 1px solid #86efac; }
        .legenda-cor.ocupado { background: #fef3c7; border: 1px solid #fde68a; }
        .legenda-cor.lab { background: #dbeafe; border: 1px solid #93c5fd; }
        
        /* Tabela da grade */
        .grade-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 13px;
        }
        .grade-table th {
            background: #0f172a;
            color: #eab308;
            padding: 14px 10px;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            border: 1px solid #1e293b;
        }
        .grade-table td {
            padding: 10px;
            border: 1px solid #e2e8f0;
            vertical-align: top;
            min-width: 150px;
            height: 70px;
        }
        .grade-table td.livre {
            background: #dcfce7;
            text-align: center;
            color: #166534;
            font-weight: 500;
            font-size: 12px;
        }
        .grade-table td.ocupado {
            background: #fef3c7;
        }
        .grade-table td.lab-info {
            background: #dbeafe;
        }
        .grade-table td.lab-info .icone-lab {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .grade-table .horario-col {
            background: #f8fafc;
            font-weight: 700;
            text-align: center;
            color: #475569;
            width: 100px;
            font-size: 13px;
        }
        
        .celula-turma {
            font-weight: 700;
            color: #1e293b;
            display: block;
        }
        .celula-disciplina {
            color: #475569;
            font-size: 12px;
            display: block;
        }
        .celula-professor {
            color: #64748b;
            font-size: 11px;
            display: block;
            margin-top: 2px;
        }
        
        /* Responsivo */
        @media (max-width: 768px) {
            .grade-table th, .grade-table td {
                padding: 6px;
                font-size: 11px;
                min-width: 100px;
            }
            .top-bar h1 { font-size: 16px; }
        }
        
        @media print {
            body { background: white; }
            .top-bar { background: #0f172a !important; -webkit-print-color-adjust: exact; }
            .btn, .acoes { display: none; }
            .container { margin: 0; padding: 0; }
            .grade-table { box-shadow: none; }
        }
    </style>
</head>
<body>

    <!-- Barra superior -->
    <div class="top-bar">
        <h1><i class="fa-solid fa-desktop"></i> Agenda do Laboratório</h1>
        <div class="acoes">
            <button class="btn btn-turno ativo" id="btn-manha" onclick="filtrarTurno('Manhã')">
                <i class="fa-solid fa-sun"></i> Manhã
            </button>
            <button class="btn btn-turno" id="btn-tarde" onclick="filtrarTurno('Tarde')">
                <i class="fa-solid fa-moon"></i> Tarde
            </button>
            <button class="btn btn-imprimir" onclick="window.print()">
                <i class="fa-solid fa-print"></i> Imprimir
            </button>
            <a href="restrito.html" class="btn btn-voltar">
                <i class="fa-solid fa-arrow-left"></i> Voltar
            </a>
        </div>
    </div>

    <div class="container">
        <!-- Recurso (Lab, Tablets...) -->
        <div id="abas-recurso" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;"></div>

        <!-- Legenda -->
        <div class="legenda">
            <div class="legenda-item">
                <div class="legenda-cor livre"></div>
                <span>Livre</span>
            </div>
            <div class="legenda-item">
                <div class="legenda-cor lab"></div>
                <span>Em uso (aula fixa da grade)</span>
            </div>
            <div class="legenda-item">
                <div class="legenda-cor ocupado"></div>
                <span>Sem vaga (todos os kits ou unidades em uso)</span>
            </div>
        </div>
        <p id="resumo-recurso" style="font-size:13px;color:#475569;margin:-6px 0 12px;"></p>

        <!-- Grade de horários -->
        <div id="area-grade">
            <div style="text-align:center;padding:50px;color:#64748b;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size:40px;display:block;margin-bottom:15px;"></i>
                Carregando agenda do laboratório...
            </div>
        </div>
    </div>

    <script src="horarios-gestao.js?v=1"></script>
    <script>
        const APPS_SCRIPT_URL = SIGA_CONFIG.APPS_SCRIPT_URL;
        const H = window.HorariosNucleo;
        let turnoAtual = 'Manhã';
        let todosHorarios = [];
        let recursos = [{ recurso: 'Lab. Informática', simultaneas: 1 }, { recurso: 'Tablet', simultaneas: 1 }];
        let recursoAtual = 'Lab. Informática';
        const esc = escaparHTML;

        window.addEventListener('DOMContentLoaded', carregarAgenda);

        function filtrarTurno(turno) {
            turnoAtual = turno;
            document.getElementById('btn-manha').classList.toggle('ativo', turno === 'Manhã');
            document.getElementById('btn-tarde').classList.toggle('ativo', turno === 'Tarde');
            renderizarGrade();
        }

        function escolherRecurso(nome) {
            recursoAtual = nome;
            desenharAbas();
            renderizarGrade();
        }

        function desenharAbas() {
            document.getElementById('abas-recurso').innerHTML = recursos.map((r, i) =>
                '<button class="btn btn-turno' + (r.recurso === recursoAtual ? ' ativo' : '') + '" style="color:#0f172a;border:1px solid #cbd5e1;" onclick="escolherRecurso(recursos[' + i + '].recurso)">🖥️ ' +
                esc(r.recurso) + (r.simultaneas > 1 ? ' (' + r.simultaneas + ')' : '') + '</button>').join('');
            document.querySelector('.top-bar h1').innerHTML = '<i class="fa-solid fa-desktop"></i> Agenda — ' + esc(recursoAtual);
        }

        async function carregarAgenda() {
            try {
                const [respH, respR] = await Promise.all([
                    fetch(APPS_SCRIPT_URL + '?aba=horarios'),
                    fetch(APPS_SCRIPT_URL + '?aba=recursos').catch(() => null)
                ]);
                const data = await respH.json();
                try {
                    const rec = respR ? await respR.json() : null;
                    if (rec && rec.status === 'success' && rec.recursos && rec.recursos.length) recursos = rec.recursos;
                } catch (e) { /* backend antigo: usa os padrões */ }
                const pedido = new URLSearchParams(location.search).get('recurso');
                recursoAtual = (recursos.find(r => r.recurso === pedido) || recursos[0]).recurso;
                desenharAbas();

                if (data.status === 'success' && data.horarios) {
                    todosHorarios = data.horarios;
                    renderizarGrade();
                } else {
                    document.getElementById('area-grade').innerHTML =
                        '<div style="text-align:center;padding:50px;color:#94a3b8;">Nenhum horário encontrado.</div>';
                }
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('area-grade').innerHTML =
                    '<div style="text-align:center;padding:50px;color:#ef4444;">Erro ao carregar dados.</div>';
            }
        }

        function renderizarGrade() {
            const area = document.getElementById('area-grade');
            const horarios = H.HORARIOS_FIXOS[turnoAtual];
            const cfg = recursos.find(r => r.recurso === recursoAtual) || { simultaneas: 1 };
            const capacidade = Math.max(1, parseInt(cfg.simultaneas, 10) || 1);
            // Só o que usa ESTE recurso conta: aula em sala comum não ocupa o laboratório
            const usos = todosHorarios.filter(h => h.turno === turnoAtual && H.recursoDoLocal(h.local, recursos) === recursoAtual);
            let livres = 0, total = 0;

            let html = '<table class="grade-table"><thead><tr><th>Horário</th>';
            H.DIAS.forEach(dia => { html += '<th>' + dia + '</th>'; });
            html += '</tr></thead><tbody>';

            H.AULAS.forEach((aula, index) => {
                html += '<tr><td class="horario-col">' + aula + '<br><small>' + horarios[index] + '</small></td>';
                H.DIAS.forEach(dia => {
                    total++;
                    const aqui = usos.filter(h => h.dia === dia && h.aula === aula);
                    if (!aqui.length) {
                        livres++;
                        html += '<td class="livre">🟢 Livre' + (capacidade > 1 ? '<br><small>' + capacidade + ' disponíveis</small>' : '') + '</td>';
                        return;
                    }
                    const lotado = capacidade > 1 && aqui.length >= capacidade;
                    html += '<td class="' + (lotado ? 'ocupado' : 'lab-info') + '">';
                    if (capacidade > 1) html += '<span class="icone-lab">' + aqui.length + ' de ' + capacidade + ' em uso</span>';
                    aqui.forEach(h => {
                        html += '<span class="celula-turma">' + esc(h.turma) + '</span>' +
                            '<span class="celula-disciplina">' + esc(h.disciplina || '—') + '</span>' +
                            '<span class="celula-professor">👨‍🏫 ' + esc(h.professor || '—') + '</span>';
                    });
                    if (aqui.length > capacidade) html += '<span style="color:#b91c1c;font-size:11px;font-weight:700;">⚠️ Mais turmas que o recurso comporta</span>';
                    html += '</td>';
                });
                html += '</tr>';
                if (aula === '3ª') {
                    html += '<tr class="intervalo" style="background:#fef3c7;"><td class="horario-col" style="background:#fde68a;font-weight:700;">☕ INTERVALO</td>' +
                        '<td colspan="5" style="text-align:center;font-weight:600;color:#92400e;background:#fef3c7;">' + (turnoAtual === 'Manhã' ? '09:30-09:40' : '15:30-15:40') + '</td></tr>';
                }
            });
            html += '</tbody></table>';
            area.innerHTML = html;
            document.getElementById('resumo-recurso').textContent = livres + ' de ' + total + ' horários livres no turno da ' + (turnoAtual === 'Manhã' ? 'manhã' : 'tarde') + '.';
        }
    </script>
</body>
</html>
