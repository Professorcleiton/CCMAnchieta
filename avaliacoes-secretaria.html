<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliações Pendentes — Secretaria SIGA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --azul: #005088;
      --dourado: #eab308;
      --verde: #0d9488;
      --vermelho: #b91c1c;
      --bg-card: #ffffff;
      --texto: #1f2937;
      --borda: #e5e7eb;
    }
    body.dark {
      --bg-card: #1e293b;
      --texto: #f1f5f9;
      --borda: #334155;
      background: #0f172a;
      color: var(--texto);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      color: var(--texto);
      padding-bottom: 80px;
    }
    .topbar {
      background: var(--azul);
      color: #fff;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .topbar h1 { font-size: 1.1rem; flex: 1; }
    .topbar #usuario-nome { font-size: .85rem; opacity: .9; text-align: right; }
    .topbar .btn-dark {
      background: rgba(255,255,255,.15); border: none; color: #fff;
      padding: .4rem .7rem; border-radius: 8px; cursor: pointer;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 1.2rem; }

    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 900px) {
      .cards-resumo { grid-template-columns: repeat(2, 1fr); }
    }
    .card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.1rem;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
      border-left: 5px solid var(--azul);
    }
    .card .num { display: block; font-size: 2rem; font-weight: 700; }
    .card .label { font-size: .8rem; opacity: .75; }
    .card.pendente { border-left-color: #f59e0b; }
    .card.pendente .num { color: #d97706; }
    .card.impresso { border-left-color: var(--verde); }
    .card.impresso .num { color: var(--verde); }
    .card.entregue { border-left-color: #2563eb; }
    .card.entregue .num { color: #2563eb; }

    .filtros {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .filtros select, .filtros input {
      padding: .55rem .8rem;
      border-radius: 8px;
      border: 1px solid var(--borda);
      background: var(--bg-card);
      color: var(--texto);
      font-size: .9rem;
    }
    .filtros input[type="text"] { flex: 1; min-width: 200px; }
    .filtros .btn-limpar {
      background: #fee2e2; color: #dc2626; border: none;
      padding: .55rem .9rem; border-radius: 8px; cursor: pointer;
      font-weight: bold; font-size: .85rem;
    }

    .tabela-container {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th, td {
      padding: .7rem .6rem;
      text-align: left;
      font-size: .85rem;
      border-bottom: 1px solid var(--borda);
    }
    th {
      background: var(--azul);
      color: #fff;
      font-weight: 600;
      position: sticky;
      top: 0;
      white-space: nowrap;
    }
    tr:hover { background: rgba(0,80,136,.05); }
    body.dark tr:hover { background: rgba(234,179,8,.05); }

    .status-badge {
      display: inline-block;
      padding: .25rem .7rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .status-pendente { background: #f59e0b; color: #000; }
    .status-impresso { background: var(--verde); }
    .status-entregue { background: #2563eb; }
    .status-cancelado { background: #6b7280; }

    .btn-acao {
      padding: .35rem .6rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
      margin: .1rem;
      display: inline-flex;
      align-items: center;
      gap: .3rem;
    }
    .btn-acao:hover { opacity: .85; }
    .btn-print { background: var(--azul); color: #fff; }
    .btn-mark-print { background: var(--verde); color: #fff; }
    .btn-deliver { background: #2563eb; color: #fff; }
    .btn-cancel { background: #dc2626; color: #fff; }

    .toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: var(--azul); color: #fff; padding: .7rem 1.2rem;
      border-radius: 8px; opacity: 0; pointer-events: none;
      transition: opacity .3s; z-index: 1000;
      font-size: .9rem; font-weight: bold;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }
    .toast.ativo { opacity: 1; }
    .toast.erro { background: #dc2626; }
    .toast.sucesso { background: #16a34a; }

    .loading {
      text-align: center; padding: 3rem; color: #94a3b8;
    }
    .loading .spinner {
      display: inline-block; width: 40px; height: 40px;
      border: 4px solid rgba(0,80,136,.2);
      border-top-color: var(--azul);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-voltar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--azul); color: #fff; padding: .7rem 1.5rem;
      border-radius: 999px; text-decoration: none; font-weight: bold;
      display: flex; align-items: center; gap: .5rem;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      font-size: .9rem;
    }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: 1rem;
    }
    .modal-overlay.ativo { display: flex; }
    .modal-content {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.5rem;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: .8rem;
      border-bottom: 2px solid var(--borda);
    }
    .modal-header h3 { font-size: 1.1rem; color: var(--azul); }
    body.dark .modal-header h3 { color: var(--dourado); }
    .modal-close {
      background: none; border: none;
      font-size: 1.5rem; cursor: pointer; color: var(--texto);
    }

    .detalhe-linha {
      display: flex; justify-content: space-between;
      padding: .5rem 0; border-bottom: 1px solid var(--borda);
      font-size: .9rem;
    }
    .detalhe-linha strong { color: var(--azul); }
    body.dark .detalhe-linha strong { color: var(--dourado); }

    .preview-conteudo {
      background: #f8fafc; border: 1px solid var(--borda);
      border-radius: 8px; padding: 1rem;
      margin: 1rem 0; max-height: 300px; overflow-y: auto;
      font-family: 'Times New Roman', serif;
      color: #000;
    }
    body.dark .preview-conteudo { background: #1e293b; color: var(--texto); }

    @media print {
      body * { visibility: hidden; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <h1><i class="fas fa-clipboard-check"></i> Avaliações — Secretaria</h1>
    <span id="usuario-nome">Carregando...</span>
    <button class="btn-dark" id="btn-tema" title="Alternar tema"><i class="fas fa-moon"></i></button>
  </header>

  <main class="container">

    <!-- CARDS DE RESUMO -->
    <section class="cards-resumo">
      <div class="card">
        <i class="fas fa-list" style="font-size:1.4rem;color:var(--azul);margin-bottom:.3rem;"></i>
        <span class="num" id="stat-total">0</span>
        <span class="label">Total de Pedidos</span>
      </div>
      <div class="card pendente">
        <i class="fas fa-clock" style="font-size:1.4rem;color:#d97706;margin-bottom:.3rem;"></i>
        <span class="num" id="stat-pendentes">0</span>
        <span class="label">Pendentes</span>
      </div>
      <div class="card impresso">
        <i class="fas fa-print" style="font-size:1.4rem;color:var(--verde);margin-bottom:.3rem;"></i>
        <span class="num" id="stat-impressos">0</span>
        <span class="label">Impressos</span>
      </div>
      <div class="card entregue">
        <i class="fas fa-check-double" style="font-size:1.4rem;color:#2563eb;margin-bottom:.3rem;"></i>
        <span class="num" id="stat-entregues">0</span>
        <span class="label">Entregues</span>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="filtros">
      <select id="filtro-status">
        <option value="">Todos os status</option>
        <option value="Pendente" selected>Pendente</option>
        <option value="Impresso">Impresso</option>
        <option value="Entregue">Entregue</option>
        <option value="Cancelado">Cancelado</option>
      </select>
      <input type="text" id="filtro-busca" placeholder="🔍 Buscar por professor, turma, disciplina ou ID...">
      <button class="btn-limpar" onclick="limparFiltros()">
        <i class="fas fa-xmark"></i> Limpar
      </button>
    </section>

    <!-- TABELA -->
    <section class="tabela-container">
      <div id="loading" class="loading">
        <span class="spinner"></span>
        <p>Carregando pedidos...</p>
      </div>
      <table id="tabela-pedidos" style="display:none;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Data</th>
            <th>Professor</th>
            <th>Disciplina</th>
            <th>Turma</th>
            <th>Trim.</th>
            <th>Prova</th>
            <th>Cópias</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <div id="vazio" class="loading" style="display:none;">
        <i class="fas fa-inbox" style="font-size:3rem;color:#cbd5e1;display:block;margin-bottom:1rem;"></i>
        <p>Nenhum pedido encontrado com os filtros atuais.</p>
      </div>
    </section>

  </main>

  <a href="restrito.html" class="footer-voltar">
    <i class="fas fa-arrow-left"></i> Voltar ao Sistema
  </a>

  <!-- MODAL DE DETALHES -->
  <div class="modal-overlay" id="modal-detalhes" onclick="fecharModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3><i class="fas fa-file-lines"></i> Detalhes do Pedido</h3>
        <button class="modal-close" onclick="fecharModal()">&times;</button>
      </div>
      <div id="modal-corpo"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // =============================================
    // CONFIGURAÇÃO
    // =============================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbym9DGWB6hBj7nEmoWFM0vmErbzbq4VVobxY4PYRVEsgPmu7A98OxjLfiFY6D4E_ESUXw/exec';

    let usuarioLogado = null;
    let pedidosOriginais = [];
    let pedidosFiltrados = [];

    // =============================================
    // INICIALIZAÇÃO
    // =============================================
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 Iniciando avaliacoes-secretaria.html');

      const sessaoRaw = sessionStorage.getItem('sgi_ccma_session') || localStorage.getItem('sgi_ccma_session');
      if (!sessaoRaw) {
        alert('Sessão não encontrada. Faça login novamente.');
        window.location.href = 'index.html';
        return;
      }
      try {
        usuarioLogado = JSON.parse(sessaoRaw);
      } catch (e) {
        alert('Sessão inválida.');
        window.location.href = 'index.html';
        return;
      }
      if (!usuarioLogado.token) {
        alert('Sessão sem token.');
        window.location.href = 'index.html';
        return;
      }
      const nivel = parseInt(usuarioLogado.nivel) || 0;
      if (nivel < 3) {
        alert('Acesso restrito. Nível 3+ necessário.');
        window.location.href = 'restrito.html';
        return;
      }

      document.getElementById('usuario-nome').textContent = usuarioLogado.nome;

      // Tema escuro
      if (localStorage.getItem('tema') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('btn-tema').innerHTML = '<i class="fas fa-sun"></i>';
      }
      document.getElementById('btn-tema').addEventListener('click', () => {
        document.body.classList.toggle('dark');
        const dark = document.body.classList.contains('dark');
        localStorage.setItem('tema', dark ? 'dark' : 'light');
        document.getElementById('btn-tema').innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      });

      // Listeners
      document.getElementById('filtro-status').addEventListener('change', aplicarFiltros);
      document.getElementById('filtro-busca').addEventListener('input', aplicarFiltros);

      // Carrega
      carregarEstatisticas();
      carregarPedidos();
    });

    // =============================================
    // HELPERS
    // =============================================
    function toast(msg, tipo) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ativo' + (tipo ? ' ' + tipo : '');
      setTimeout(() => t.classList.remove('ativo'), 3500);
      console.log('💬', msg);
    }

    // =============================================
    // ESTATÍSTICAS
    // =============================================
    async function carregarEstatisticas() {
      try {
        const resp = await fetch(APPS_SCRIPT_URL + '?aba=avaliacoes_estatisticas');
        const stats = await resp.json();
        document.getElementById('stat-total').textContent = stats.total || 0;
        document.getElementById('stat-pendentes').textContent = stats.pendentes || 0;
        document.getElementById('stat-impressos').textContent = stats.impressos || 0;
        document.getElementById('stat-entregues').textContent = stats.entregues || 0;
      } catch (e) {
        console.error('Erro ao carregar estatísticas:', e);
      }
    }

    // =============================================
    // PEDIDOS
    // =============================================
    async function carregarPedidos() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('tabela-pedidos').style.display = 'none';
      document.getElementById('vazio').style.display = 'none';

      try {
        const resp = await fetch(APPS_SCRIPT_URL + '?aba=avaliacoes_listar');
        const data = await resp.json();
        pedidosOriginais = Array.isArray(data) ? data : [];
        aplicarFiltros();
      } catch (e) {
        console.error('Erro ao carregar pedidos:', e);
        toast('Erro ao carregar pedidos.', 'erro');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('vazio').style.display = 'block';
      }
    }

    // =============================================
    // FILTROS
    // =============================================
    function aplicarFiltros() {
      const status = document.getElementById('filtro-status').value;
      const busca = document.getElementById('filtro-busca').value.trim().toLowerCase();

      pedidosFiltrados = pedidosOriginais.filter(p => {
        if (status && String(p.status).trim() !== status) return false;
        if (busca) {
          const blob = [
            p.idPedido, p.professorNome, p.professorEmail,
            p.disciplina, p.turma, p.trimestre
          ].join(' ').toLowerCase();
          if (!blob.includes(busca)) return false;
        }
        return true;
      });

      // Ordena: mais recentes primeiro
      pedidosFiltrados.sort((a, b) => {
        const da = parseData(a.dataPedido);
        const db = parseData(b.dataPedido);
        return db - da;
      });

      renderizarTabela();
    }

    function limparFiltros() {
      document.getElementById('filtro-status').value = '';
      document.getElementById('filtro-busca').value = '';
      aplicarFiltros();
    }

    function parseData(str) {
      if (!str) return new Date(0);
      const partes = String(str).trim().split(' ')[0].split('/');
      if (partes.length === 3) return new Date(partes[2], partes[1]-1, partes[0]);
      return new Date(str);
    }

    // =============================================
    // RENDERIZAR TABELA
    // =============================================
    function renderizarTabela() {
      document.getElementById('loading').style.display = 'none';
      const tabela = document.getElementById('tabela-pedidos');
      const vazio = document.getElementById('vazio');
      const tbody = document.getElementById('corpo-tabela');

      if (pedidosFiltrados.length === 0) {
        tabela.style.display = 'none';
        vazio.style.display = 'block';
        return;
      }

      vazio.style.display = 'none';
      tabela.style.display = 'table';
      tbody.innerHTML = '';

      pedidosFiltrados.forEach(p => {
        const statusClass = {
          'Pendente': 'status-pendente',
          'Impresso': 'status-impresso',
          'Entregue': 'status-entregue',
          'Cancelado': 'status-cancelado'
        }[p.status] || 'status-pendente';

        const dataProvaFormatada = p.dataProva
          ? String(p.dataProva).split('-').reverse().join('/')
          : '—';

        const linha = document.createElement('tr');
        linha.innerHTML = `
          <td><strong>${p.idPedido}</strong></td>
          <td>${p.dataPedido || '—'}</td>
          <td>${p.professorNome || '—'}</td>
          <td>${p.disciplina || '—'}</td>
          <td>${p.turma || '—'}</td>
          <td>${p.trimestre || '—'}</td>
          <td>${dataProvaFormatada}</td>
          <td>${p.qtdCopias || 0}</td>
          <td><span class="status-badge ${statusClass}">${p.status}</span></td>
          <td>
            <button class="btn-acao btn-print" onclick="abrirDetalhes('${p.idPedido}')" title="Ver detalhes">
              <i class="fas fa-eye"></i>
            </button>
            ${p.status === 'Pendente' ? `
              <button class="btn-acao btn-mark-print" onclick="marcarImpresso('${p.idPedido}')" title="Marcar como Impresso">
                <i class="fas fa-print"></i>
              </button>
              <button class="btn-acao btn-cancel" onclick="cancelarPedido('${p.idPedido}')" title="Cancelar">
                <i class="fas fa-xmark"></i>
              </button>
            ` : ''}
            ${p.status === 'Impresso' ? `
              <button class="btn-acao btn-deliver" onclick="marcarEntregue('${p.idPedido}')" title="Marcar como Entregue">
                <i class="fas fa-check-double"></i>
              </button>
            ` : ''}
          </td>
        `;
        tbody.appendChild(linha);
      });
    }

    // =============================================
    // AÇÕES
    // =============================================
    async function marcarImpresso(idPedido) {
      if (!confirm('Marcar o pedido ' + idPedido + ' como IMPRESSO?\n\nO professor receberá um e-mail de confirmação.')) return;

      try {
        const resp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            operacao: 'MARCAR_PEDIDO_IMPRESSO',
            token: usuarioLogado.token,
            idPedido: idPedido,
            novoStatus: 'Impresso'
          })
        });
        const result = await resp.json();
        if (result.status === 'success') {
          toast('✅ Pedido marcado como impresso. E-mail enviado ao professor.', 'sucesso');
          carregarEstatisticas();
          carregarPedidos();
        } else {
          toast('❌ ' + (result.message || 'Erro.'), 'erro');
        }
      } catch (e) {
        console.error(e);
        toast('Erro de conexão.', 'erro');
      }
    }

    async function marcarEntregue(idPedido) {
      if (!confirm('Marcar o pedido ' + idPedido + ' como ENTREGUE ao professor?')) return;

      try {
        const resp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            operacao: 'MARCAR_PEDIDO_IMPRESSO',
            token: usuarioLogado.token,
            idPedido: idPedido,
            novoStatus: 'Entregue'
          })
        });
        const result = await resp.json();
        if (result.status === 'success') {
          toast('✅ Pedido marcado como entregue.', 'sucesso');
          carregarEstatisticas();
          carregarPedidos();
        } else {
          toast('❌ ' + (result.message || 'Erro.'), 'erro');
        }
      } catch (e) {
        console.error(e);
        toast('Erro de conexão.', 'erro');
      }
    }

    async function cancelarPedido(idPedido) {
      if (!confirm('⚠️ Cancelar o pedido ' + idPedido + '?\n\nO contador de impressões será liberado.')) return;

      try {
        const resp = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            operacao: 'CANCELAR_PEDIDO_AVALIACAO',
            token: usuarioLogado.token,
            idPedido: idPedido
          })
        });
        const result = await resp.json();
        if (result.status === 'success') {
          toast('✅ Pedido cancelado. Contador liberado.', 'sucesso');
          carregarEstatisticas();
          carregarPedidos();
        } else {
          toast('❌ ' + (result.message || 'Erro.'), 'erro');
        }
      } catch (e) {
        console.error(e);
        toast('Erro de conexão.', 'erro');
      }
    }

    // =============================================
    // MODAL DE DETALHES
    // =============================================
    function abrirDetalhes(idPedido) {
      const p = pedidosOriginais.find(x => x.idPedido === idPedido);
      if (!p) return;

      const anexos = (p.anexos || '').split(',').filter(x => x.trim() && !x.includes('ERRO'));
      const anexosHTML = anexos.length > 0
        ? anexos.map((url, i) => `<a href="${url}" target="_blank" class="btn-acao btn-print" style="text-decoration:none;margin-top:.3rem;display:inline-block;"><i class="fas fa-paperclip"></i> Anexo ${i+1}</a>`).join(' ')
        : '<span style="color:#94a3b8;font-size:.85rem;">Sem anexos</span>';

      const statusClass = {
        'Pendente': 'status-pendente',
        'Impresso': 'status-impresso',
        'Entregue': 'status-entregue',
        'Cancelado': 'status-cancelado'
      }[p.status] || '';

      document.getElementById('modal-corpo').innerHTML = `
        <div class="detalhe-linha"><strong>ID:</strong> <span>${p.idPedido}</span></div>
        <div class="detalhe-linha"><strong>Data do Pedido:</strong> <span>${p.dataPedido || '—'}</span></div>
        <div class="detalhe-linha"><strong>Professor(a):</strong> <span>${p.professorNome}</span></div>
        <div class="detalhe-linha"><strong>E-mail:</strong> <span>${p.professorEmail}</span></div>
        <div class="detalhe-linha"><strong>Disciplina:</strong> <span>${p.disciplina}</span></div>
        <div class="detalhe-linha"><strong>Turma:</strong> <span>${p.turma}</span></div>
        <div class="detalhe-linha"><strong>Trimestre:</strong> <span>${p.trimestre}</span></div>
        <div class="detalhe-linha"><strong>Data da Prova:</strong> <span>${p.dataProva ? String(p.dataProva).split('-').reverse().join('/') : '—'}</span></div>
        <div class="detalhe-linha"><strong>Valor:</strong> <span>${p.valor || '—'}</span></div>
        <div class="detalhe-linha"><strong>Cópias:</strong> <span>${p.qtdCopias}</span></div>
        <div class="detalhe-linha"><strong>Status:</strong> <span class="status-badge ${statusClass}">${p.status}</span></div>
        <div class="detalhe-linha"><strong>Observações:</strong> <span>${p.observacoes || '—'}</span></div>
        <div style="margin-top:1rem;">
          <strong style="color:var(--azul);">Anexos:</strong><br>
          ${anexosHTML}
        </div>
        <div style="margin-top:1rem;">
          <strong style="color:var(--azul);">Conteúdo da Prova:</strong>
          <div class="preview-conteudo">${p.conteudo || '<em>Sem conteúdo</em>'}</div>
        </div>
        <div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
          <button class="btn-acao btn-print" onclick="imprimirProva('${p.idPedido}')" style="flex:1;padding:.7rem;">
            <i class="fas fa-print"></i> Imprimir Prova
          </button>
          ${p.status === 'Pendente' ? `
            <button class="btn-acao btn-mark-print" onclick="fecharModal();marcarImpresso('${p.idPedido}')" style="flex:1;padding:.7rem;">
              <i class="fas fa-check"></i> Marcar Impresso
            </button>
          ` : ''}
        </div>
      `;
      document.getElementById('modal-detalhes').classList.add('ativo');
    }

    function fecharModal(event) {
      if (event && event.target && event.target.id !== 'modal-detalhes') return;
      document.getElementById('modal-detalhes').classList.remove('ativo');
    }

    // =============================================
    // IMPRIMIR PROVA (mesmo layout do avaliacoes.html)
    // =============================================
    function imprimirProva(idPedido) {
      const p = pedidosOriginais.find(x => x.idPedido === idPedido);
      if (!p) return;

      const dataFormatada = p.dataProva
        ? String(p.dataProva).split('-').reverse().join('/')
        : '___/___/2026';

      const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Prova — ${p.disciplina} — ${p.turma}</title>
<style>
  @page { size: A4 portrait; margin: 12mm 15mm; }
  body { font-family: 'Times New Roman', serif; font-size: 11pt; color: #000; line-height: 1.45; margin: 0; padding: 8px; }
  .cabecalho { display: grid; grid-template-columns: 90px 1fr 90px; align-items: center; gap: 15px; border-bottom: 3px double #002B5B; padding-bottom: 10px; margin-bottom: 12px; }
  .cabecalho .brasao { width: 90px; height: 90px; object-fit: contain; }
  .cabecalho .titulo { text-align: center; line-height: 1.2; }
  .cabecalho .titulo h1 { font-size: 15pt; margin: 0 0 3px; color: #002B5B; text-transform: uppercase; }
  .cabecalho .titulo p { margin: 1px 0; font-size: 9pt; color: #333; }
  .info-box { background: #f4f6f9; border: 1px solid #cbd5e1; border-left: 4px solid #002B5B; padding: 8px 12px; margin-bottom: 12px; font-size: 10pt; border-radius: 4px; }
  .info-box .linha { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 3px 0; }
  .info-box strong { color: #002B5B; }
  .aluno-box { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin: 10px 0; font-size: 10.5pt; }
  .aluno-box .campo { display: flex; align-items: flex-end; gap: 5px; }
  .aluno-box .campo .linha-assinatura { border-bottom: 1px solid #000; display: inline-block; min-width: 180px; height: 16px; }
  .conteudo { margin-top: 15px; text-align: justify; font-size: 11pt; }
  .conteudo h3 { color: #002B5B; font-size: 12pt; margin: 16px 0 8px; padding-bottom: 3px; border-bottom: 1px solid #94a3b8; page-break-after: avoid; }
  .conteudo p { margin: 8px 0; }
  .conteudo ol, .conteudo ul { margin-left: 25px; padding-left: 5px; }
  .conteudo li { margin: 4px 0; }
  .rodape { margin-top: 25px; padding-top: 8px; border-top: 1px solid #94a3b8; font-size: 8.5pt; text-align: center; color: #555; }
  .no-print { text-align: center; margin-bottom: 15px; }
  .no-print button { background: #002B5B; color: #FFD700; border: none; padding: 10px 28px; border-radius: 8px; font-size: 13pt; font-weight: bold; cursor: pointer; }
  @media print { .no-print { display: none; } body { padding: 0; } .info-box { background: #fff; } }
</style>
</head>
<body>

<div class="no-print">
  <button onclick="window.print()">🖨️ Imprimir</button>
</div>

<div class="cabecalho">
  <img src="img/brasao-anchieta.png" alt="Brasão" class="brasao" onerror="this.src='img/SIG.png'">
  <div class="titulo">
    <h1>Colégio Cívico-Militar Anchieta</h1>
    <p>Secretaria de Estado da Educação — SEED/PR</p>
    <p>Núcleo Regional de Educação de Umuarama</p>
  </div>
  <div></div>
</div>

<div class="info-box">
  <div class="linha">
    <div><strong>Disciplina:</strong> ${p.disciplina}</div>
    <div><strong>Série/Turma:</strong> ${p.turma}</div>
    <div><strong>Trimestre:</strong> ${p.trimestre}</div>
  </div>
  <div class="linha">
    <div><strong>Professor(a):</strong> ${p.professorNome}</div>
    <div><strong>Data:</strong> ${dataFormatada}</div>
    <div><strong>Valor:</strong> ${p.valor || '___'}</div>
  </div>
</div>

<div class="aluno-box">
  <div class="campo"><strong>Aluno(a):</strong> <span class="linha-assinatura" style="min-width:300px;"></span></div>
  <div class="campo"><strong>Nº:</strong> <span class="linha-assinatura" style="min-width:60px;"></span></div>
  <div class="campo"><strong>Nota:</strong> <span class="linha-assinatura" style="min-width:80px;"></span></div>
</div>

<div class="conteudo">
  ${p.conteudo || '<p><em>(Sem conteúdo)</em></p>'}
</div>

<div class="rodape">
  Avaliação de ${p.professorNome} — ${p.disciplina} — ${p.turma} — ${p.trimestre} de 2026<br>
  CCM Anchieta — Cruzeiro do Oeste/PR
</div>

</body>
</html>`;

      const win = window.open('', '_blank', 'width=900,height=1000');
      if (!win) {
        return toast('Permita pop-ups para visualizar a prévia.', 'erro');
      }
      win.document.write(html);
      win.document.close();
    }
  </script>
</body>
</html>
